<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grand Prix Rivals</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2c3142;
    --text: #f1f2f6; --muted: #9aa0b4; --red: #e8112d; --yellow: #ffd23f; --green: #00b894;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#c { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 11, 16, 0.86); z-index: 10; padding: 16px; overflow-y: auto; }
  .overlay.show { display: flex; }
  .panel { width: min(860px, 100%); background: var(--surface); border: 1px solid var(--border);
    border-top: 4px solid var(--red); border-radius: 14px; padding: 22px 24px; margin: auto; }
  .brand { font-size: clamp(1.6rem, 4.5vw, 2.4rem); font-weight: 900; font-style: italic; letter-spacing: -0.5px; }
  .brand span { color: var(--red); }
  .sub { color: var(--muted); margin: 2px 0 16px; font-size: 0.92rem; }
  .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; font-weight: 700; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .track-card { background: var(--surface2); border: 2px solid var(--border); border-radius: 10px; padding: 8px; cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease; }
  .track-card:hover { transform: translateY(-2px); border-color: #4a5068; }
  .track-card.on { border-color: var(--red); }
  .track-card canvas { width: 100%; height: 92px; display: block; border-radius: 6px; }
  .track-card b { display: block; font-size: 0.9rem; margin-top: 6px; }
  .track-card small { color: var(--muted); font-size: 0.75rem; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { background: none; border: none; color: var(--muted); padding: 7px 16px; border-radius: 7px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  .seg button.on { background: var(--red); color: #fff; }
  .bestline { color: var(--yellow); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 12px; }
  button.go { background: var(--red); color: #fff; border: none; border-radius: 10px; padding: 12px 28px; font-size: 1.05rem;
    font-weight: 800; cursor: pointer; letter-spacing: 0.3px; }
  button.go:hover { filter: brightness(1.12); }
  button.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 22px;
    font-size: 1rem; font-weight: 700; cursor: pointer; }
  .keys { color: #6b7189; font-size: 0.8rem; margin-top: 14px; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  table.res { width: 100%; border-collapse: collapse; margin: 14px 0 18px; font-variant-numeric: tabular-nums; }
  table.res th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 6px 8px; }
  table.res td { padding: 8px; border-top: 1px solid var(--border); font-size: 0.95rem; }
  table.res tr.me td { background: rgba(232, 17, 45, 0.14); font-weight: 800; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .big { font-size: 1.6rem; font-weight: 900; }

  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 14px; z-index: 5; pointer-events: none; }
  #touch.show { display: flex; }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch div.b { width: 74px; height: 74px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; color: rgba(255,255,255,0.8); touch-action: none; }
  #touch div.b.down { background: rgba(232, 17, 45, 0.45); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="touch">
  <div class="grp"><div class="b" data-k="left">◀</div><div class="b" data-k="right">▶</div></div>
  <div class="grp"><div class="b" data-k="brake">▼</div><div class="b" data-k="gas">▲</div></div>
</div>

<div id="menu" class="overlay show">
  <div class="panel">
    <div class="brand"><span>GRAND PRIX</span> RIVALS</div>
    <p class="sub">Open-wheel racing · 8 circuits · 8 cars on the grid</p>
    <div class="label">Circuit</div>
    <div id="tracks" class="tracks"></div>
    <div class="row">
      <div>
        <div class="label">Bot difficulty</div>
        <div class="seg" id="diffSeg">
          <button data-v="easy">Easy</button><button data-v="medium">Medium</button><button data-v="hard">Hard</button>
        </div>
      </div>
      <div>
        <div class="label">Laps</div>
        <div class="seg" id="lapSeg">
          <button data-v="3">3</button><button data-v="5">5</button><button data-v="8">8</button>
        </div>
      </div>
    </div>
    <div class="bestline" id="bestline"></div>
    <div class="btnrow"><button class="go" id="startBtn">Start race ▸</button></div>
    <div class="keys">↑ / W throttle · ↓ / S brake &amp; reverse · ← → / A D steer · R put car back on track · P pause</div>
  </div>
</div>

<div id="pause" class="overlay">
  <div class="panel" style="max-width:420px;text-align:center">
    <div class="big">Paused</div>
    <p class="sub" style="margin-top:6px">Press P to resume</p>
    <div class="btnrow" style="justify-content:center">
      <button class="go" id="resumeBtn">Resume</button>
      <button class="ghost" id="restartBtn">Restart</button>
      <button class="ghost" id="quitBtn">Menu</button>
    </div>
  </div>
</div>

<div id="results" class="overlay">
  <div class="panel">
    <div class="label" id="resTrack"></div>
    <div class="big" id="resTitle"></div>
    <div class="sub" id="resSub" style="margin-bottom:0"></div>
    <table class="res">
      <thead><tr><th>Pos</th><th>Driver</th><th>Time</th><th>Best lap</th></tr></thead>
      <tbody id="resBody"></tbody>
    </table>
    <div class="btnrow">
      <button class="go" id="againBtn">Race again</button>
      <button class="ghost" id="menuBtn">Change circuit</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ================= Setup =================
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.max(1, Math.floor(W * DPR));
    cv.height = Math.max(1, Math.floor(H * DPR));
  }
  addEventListener("resize", resize);
  resize();

  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ================= Constants =================
  const SP = 8;          // spacing between centreline samples (px)
  const TW = 124;        // track width
  const VMAX = 640;      // top speed (px/s)
  const ACC = 430;       // engine acceleration
  const BRK = 860;       // braking deceleration
  const ALAT = 1000;     // max lateral acceleration (grip)
  const RMIN = 46;       // tightest turning radius at low speed
  const CAR_R = 14;      // collision radius
  const KMH = 0.55;      // px/s to km/h for the display

  const DIFFS = {
    easy:   { mul: 0.80, label: "Easy" },
    medium: { mul: 0.90, label: "Medium" },
    hard:   { mul: 0.975, label: "Hard" }
  };

  const DRIVERS = [
    { name: "K. Arden",    color: "#00c2ff", helmet: "#ffffff" },
    { name: "M. Vasquez",  color: "#ff8a00", helmet: "#1b1b1b" },
    { name: "T. Okafor",   color: "#2ecc71", helmet: "#ffd23f" },
    { name: "L. Brandt",   color: "#c0c6d4", helmet: "#e8112d" },
    { name: "S. Moreau",   color: "#3d5afe", helmet: "#ffd23f" },
    { name: "J. Lindqvist", color: "#ff4fa3", helmet: "#ffffff" },
    { name: "R. Castellan", color: "#ffd23f", helmet: "#1b1b1b" }
  ];
  const PLAYER = { name: "You", color: "#e8112d", helmet: "#ffd23f" };

  const THEMES = {
    harbor: { ground: "#3e7b46", runoff: "#b9b29a", asphalt: "#4a4d55", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "trees" },
    desert: { ground: "#d2b07a", runoff: "#c39b63", asphalt: "#5a5650", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "cacti" },
    alpine: { ground: "#e3eaf1", runoff: "#c4ced8", asphalt: "#50545c", kerbA: "#2b6cff", kerbB: "#f4f4f4", deco: "pines" },
    neon:   { ground: "#15161f", runoff: "#22232e", asphalt: "#2d2e39", kerbA: "#ff2bd6", kerbB: "#20e3ff", deco: "buildings" },
    coast:  { ground: "#4b8b4d", runoff: "#e3d3a0", asphalt: "#4c4f57", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "palms" },
    forest: { ground: "#2a5a32", runoff: "#76805e", asphalt: "#45484f", kerbA: "#ffd23f", kerbB: "#1d1d1d", deco: "trees" },
    canyon: { ground: "#a4573a", runoff: "#c07a52", asphalt: "#4f4a48", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "rocks" },
    oval:   { ground: "#3f8a44", runoff: "#a7b49a", asphalt: "#484b53", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "stands" },
    stadium: { ground: "#1b2330", runoff: "#2a3444", asphalt: "#3b404c", kerbA: "#ffd23f", kerbB: "#1d1d1d", deco: "stands" },
    mesa:    { ground: "#c96f3b", runoff: "#d98c58", asphalt: "#4f4744", kerbA: "#e8112d", kerbB: "#f4f4f4", deco: "rocks" },
    pinball: { ground: "#251b45", runoff: "#33285c", asphalt: "#2f2c48", kerbA: "#ff2bd6", kerbB: "#ffd23f", deco: "buildings" }
  };

  // Gimmick circuits: boost pads, jump ramps over gaps, and bumpers on the racing line.
  const GAP_PTS = 12;          // length of a jump gap, in centreline samples
  const BOOST_TIME = 1.4;      // seconds of extra speed from a boost pad
  const BUMPER_R = 18;

  // Control points on a ~100 x 70 grid; the race runs in point order.
  const TRACK_DEFS = [
    { name: "Harbor Circuit",  tag: "Flowing · beginner friendly", theme: "harbor",
      pts: [[10,10],[60,8],[90,12],[95,35],[88,60],[60,64],[50,55],[40,64],[12,60],[6,35]] },
    { name: "Desert Ring",     tag: "Fast sweepers in the heat", theme: "desert",
      pts: [[15,30],[25,10],[50,6],[75,10],[90,30],[85,52],[65,62],[50,56],[35,64],[18,55]] },
    { name: "Alpine Loop",     tag: "Tight hairpins on snow", theme: "alpine",
      pts: [[10,10],[45,10],[50,24],[32,30],[32,40],[70,38],[75,16],[92,12],[95,60],[60,65],[15,62],[8,40]] },
    { name: "Neon City Night", tag: "Street circuit · 90° corners", theme: "neon",
      pts: [[10,10],[50,10],[50,25],[70,25],[70,10],[92,10],[92,62],[60,62],[60,45],[35,45],[35,62],[8,62]] },
    { name: "Coastal Sprint",  tag: "Long straights · top speed", theme: "coast",
      pts: [[8,35],[20,12],[60,8],[94,14],[96,30],[80,38],[96,50],[90,64],[40,64],[15,58]] },
    { name: "Forest Esses",    tag: "Snaking esses through the trees", theme: "forest",
      pts: [[10,15],[30,8],[45,18],[60,8],[80,15],[92,35],[80,50],[92,62],[60,64],[45,52],[30,64],[10,55],[5,35]] },
    { name: "Canyon Hairpins", tag: "Switchbacks · brake hard", theme: "canyon",
      pts: [[10,8],[90,8],[94,16],[88,24],[28,24],[22,30],[28,37],[88,38],[94,50],[88,64],[10,64],[5,36]] },
    { name: "Grand Oval",      tag: "Speedway with an infield kink", theme: "oval",
      pts: [[20,10],[80,10],[95,25],[95,45],[80,60],[55,60],[50,50],[45,60],[20,60],[5,45],[5,25]] },
    { name: "Crossover Eight", tag: "NEW · figure-8 with a live crossing", theme: "stadium", startFrac: 0,
      pts: Array.from({ length: 16 }, (_, i) => {
        const t = i / 16 * Math.PI * 2, d = 1 + Math.sin(t) ** 2;
        return [50 + 46 * Math.cos(t) / d, 36 + 78 * Math.sin(t) * Math.cos(t) / d];
      }),
      features: { boost: [0.14, 0.36, 0.64, 0.86] } },
    { name: "Canyon Leap",     tag: "NEW · boost pads and jumps over gaps", theme: "mesa",
      pts: [[8,20],[35,7],[65,9],[93,18],[96,42],[80,58],[55,50],[30,63],[7,50]],
      features: { jumps: [0.22, 0.5, 0.76], boostBeforeJumps: true } },
    { name: "Pinball Park",    tag: "NEW · bumpers and boost pads", theme: "pinball",
      pts: [[10,10],[40,6],[55,20],[75,8],[94,18],[90,40],[96,60],[70,64],[55,50],[40,64],[12,58],[18,35]],
      features: {
        bumpers: [[0.08, -30], [0.13, 30], [0.3, 0], [0.42, -30], [0.47, 30], [0.6, 0], [0.72, -30], [0.77, 30]],
        boost: [0.2, 0.53, 0.66]
      } }
  ];

  // ================= Track building =================
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Centripetal Catmull-Rom: smooth curve through every control point without loops.
  function crPoint(p0, p1, p2, p3, t) {
    const d = (p, q) => Math.pow(Math.hypot(q.x - p.x, q.y - p.y), 0.5) || 1e-4;
    const t0 = 0, t1 = t0 + d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3);
    const tt = t1 + (t2 - t1) * t;
    const L = (a, b, ta, tb) => ({
      x: (tb - tt) / (tb - ta) * a.x + (tt - ta) / (tb - ta) * b.x,
      y: (tb - tt) / (tb - ta) * a.y + (tt - ta) / (tb - ta) * b.y
    });
    const A1 = L(p0, p1, t0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
    const B1 = L(A1, A2, t0, t2), B2 = L(A2, A3, t1, t3);
    return L(B1, B2, t1, t2);
  }

  function circR(a, b, c) {
    const A = Math.hypot(b.x - c.x, b.y - c.y), B = Math.hypot(a.x - c.x, a.y - c.y), C = Math.hypot(a.x - b.x, a.y - b.y);
    const cross = Math.abs((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x));
    return cross < 1e-6 ? 1e9 : A * B * C / (2 * cross);
  }

  function buildTrack(def, seed) {
    const S = 36;
    const cps = def.pts.map(p => ({ x: p[0] * S, y: p[1] * S }));
    const n = cps.length, raw = [];
    for (let i = 0; i < n; i++) {
      const p0 = cps[(i - 1 + n) % n], p1 = cps[i], p2 = cps[(i + 1) % n], p3 = cps[(i + 2) % n];
      for (let k = 0; k < 40; k++) raw.push(crPoint(p0, p1, p2, p3, k / 40));
    }
    // Resample at even spacing.
    let pts = [{ x: raw[0].x, y: raw[0].y }];
    let prev = raw[0], need = SP;
    for (let i = 1; i <= raw.length; i++) {
      const cur = raw[i % raw.length];
      let seg = Math.hypot(cur.x - prev.x, cur.y - prev.y);
      let px = prev.x, py = prev.y;
      while (seg >= need) {
        const t = need / seg;
        px += (cur.x - px) * t; py += (cur.y - py) * t;
        pts.push({ x: px, y: py });
        seg -= need; need = SP;
      }
      need -= seg; prev = cur;
    }
    const last = pts[pts.length - 1];
    if (Math.hypot(last.x - pts[0].x, last.y - pts[0].y) < SP * 0.6) pts.pop();
    let N = pts.length;
    const wrap = i => ((i % N) + N) % N;

    // Corner radius at each point.
    let R = pts.map((p, i) => circR(pts[wrap(i - 5)], p, pts[wrap(i + 5)]));

    // Put the start line on the straightest section, with room for the grid behind it.
    let bestI = 0, bestScore = -1;
    if (def.startFrac != null) bestI = Math.floor(def.startFrac * N) % N;
    else for (let i = 0; i < N; i++) {
      let m = Infinity;
      for (let k = -60; k <= 12; k += 2) m = Math.min(m, R[wrap(i + k)]);
      if (m > bestScore) { bestScore = m; bestI = i; }
    }
    pts = pts.slice(bestI).concat(pts.slice(0, bestI));
    R = R.slice(bestI).concat(R.slice(0, bestI));

    const dir = [], nrm = [];
    for (let i = 0; i < N; i++) {
      const a = pts[wrap(i - 1)], b = pts[wrap(i + 1)];
      const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const tx = (b.x - a.x) / l, ty = (b.y - a.y) / l;
      dir.push({ x: tx, y: ty }); nrm.push({ x: -ty, y: tx });
    }

    // Target speed at each point: grip-limited in corners, then braking zones worked backwards.
    const prof = R.map(r => Math.min(VMAX * 0.97, Math.sqrt(ALAT * 0.88 * r)));
    for (let pass = 0; pass < 3; pass++) {
      for (let i = N - 1; i >= 0; i--) {
        const nx = prof[(i + 1) % N];
        prof[i] = Math.min(prof[i], Math.sqrt(nx * nx + 2 * BRK * 0.72 * SP));
      }
    }

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }

    const path = new Path2D();
    pts.forEach((p, i) => i ? path.lineTo(p.x, p.y) : path.moveTo(p.x, p.y));
    path.closePath();

    const T = { def, theme: THEMES[def.theme], pts, dir, nrm, R, prof, N, path, minX, minY, maxX, maxY, deco: [] };
    T.length = N * SP;

    // Track features, placed by fraction of a lap from the start line.
    const F = def.features || {};
    const at = f => Math.floor((((f % 1) + 1) % 1) * N);
    T.boosts = []; T.jumps = []; T.bumpers = [];
    let side = 1;
    const addBoost = i => {
      i = wrap(i); side = -side;
      const p = pts[i], nr = nrm[i], d = dir[i];
      T.boosts.push({ i, x: p.x + nr.x * side * 30, y: p.y + nr.y * side * 30, a: Math.atan2(d.y, d.x) });
    };
    for (const f of F.boost || []) addBoost(at(f));
    for (const f of F.jumps || []) {
      // Nudge each ramp onto the straightest nearby stretch so cars arrive fast and level.
      const base = at(f), span = Math.floor(N * 0.06);
      let bi = base, bs = -1;
      for (let k = -span; k <= span; k++) {
        const i = wrap(base + k);
        let m = Infinity;
        for (let j = -30; j <= GAP_PTS + 70; j++) m = Math.min(m, R[wrap(i + j)]);
        if (m > bs) { bs = m; bi = i; }
      }
      const j = { ramp: bi, gap0: wrap(bi + 3), gap1: wrap(bi + 3 + GAP_PTS) };
      const c = pts[wrap(bi + 3 + GAP_PTS / 2)], cd = dir[wrap(bi + 3 + GAP_PTS / 2)];
      j.cx = c.x; j.cy = c.y; j.a = Math.atan2(cd.y, cd.x);
      T.jumps.push(j);
      if (F.boostBeforeJumps) addBoost(bi - 26);
    }
    for (const [f, off] of F.bumpers || []) {
      const i = at(f), p = pts[i], nr = nrm[i];
      T.bumpers.push({ i, off, x: p.x + nr.x * off, y: p.y + nr.y * off, r: BUMPER_R, hit: 0 });
    }
    // Profile: arrive at every ramp fast enough to clear the gap, but plan braking for after landing.
    const rampMin = () => { for (const j of T.jumps) for (let k = -40; k <= GAP_PTS + 4; k++) prof[wrap(j.ramp + k)] = Math.max(prof[wrap(j.ramp + k)], 320); };
    if (T.jumps.length) {
      rampMin();
      for (let pass = 0; pass < 2; pass++) for (let i = N - 1; i >= 0; i--) {
        const nx = prof[(i + 1) % N];
        prof[i] = Math.min(prof[i], Math.sqrt(nx * nx + 2 * BRK * 0.72 * SP));
      }
      rampMin();
    }
    const inChasm = (x, y, pad) => T.jumps.some(j => {
      const dx = x - j.cx, dy = y - j.cy, ca = Math.cos(j.a), sa = Math.sin(j.a);
      return Math.abs(dx * ca + dy * sa) < GAP_PTS * SP / 2 + pad && Math.abs(-dx * sa + dy * ca) < 470 + pad;
    });

    // Scenery placed away from the track.
    const rnd = mulberry32(seed * 977 + 13);
    const type = T.theme.deco;
    const count = type === "stands" ? 70 : type === "buildings" ? 120 : 230;
    let tries = 0;
    while (T.deco.length < count && tries < 6000) {
      tries++;
      const x = minX - 450 + rnd() * (maxX - minX + 900);
      const y = minY - 450 + rnd() * (maxY - minY + 900);
      const size = type === "buildings" ? 40 + rnd() * 70 : type === "stands" ? 1 : 10 + rnd() * 14;
      const [, d] = nearestIdx(T, x, y, -1);
      const clearance = TW / 2 + 70 + (type === "buildings" ? size * 0.75 : size);
      if (d < clearance) continue;
      if (type === "stands" && d > clearance + 90) continue;
      if (inChasm(x, y, size + 20)) continue;
      T.deco.push({ x, y, s: size, r: rnd(), r2: rnd(), a: rnd() * Math.PI * 2 });
    }
    return T;
  }

  function nearestIdx(T, x, y, hint) {
    const N = T.N, P = T.pts;
    let best = 0, bd = Infinity;
    if (hint >= 0) {
      for (let k = -24; k <= 48; k++) {
        const i = (hint + k + N) % N, p = P[i];
        const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
        if (d < bd) { bd = d; best = i; }
      }
      if (bd < (TW * 1.6) * (TW * 1.6)) return [best, Math.sqrt(bd)];
    }
    for (let i = 0; i < N; i += 2) {
      const p = P[i];
      const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = i; }
    }
    return [best, Math.sqrt(bd)];
  }

  const TRACKS = TRACK_DEFS.map((d, i) => buildTrack(d, i + 1));

  // ================= Menu =================
  let selTrack = load("gpr.track", 0);
  let selDiff = load("gpr.diff", "medium");
  let selLaps = load("gpr.laps", 3);
  if (!TRACKS[selTrack]) selTrack = 0;
  if (!DIFFS[selDiff]) selDiff = "medium";

  const tracksEl = document.getElementById("tracks");
  TRACKS.forEach((T, i) => {
    const card = document.createElement("div");
    card.className = "track-card";
    card.innerHTML = `<canvas width="360" height="184"></canvas><b>${i + 1}. ${T.def.name}</b><small>${T.def.tag}</small>`;
    const pc = card.querySelector("canvas").getContext("2d");
    pc.fillStyle = T.theme.ground; pc.fillRect(0, 0, 360, 184);
    const sc = Math.min(330 / (T.maxX - T.minX), 160 / (T.maxY - T.minY));
    pc.save();
    pc.translate(180 - (T.minX + T.maxX) / 2 * sc, 92 - (T.minY + T.maxY) / 2 * sc);
    pc.scale(sc, sc);
    pc.lineJoin = "round";
    pc.strokeStyle = "rgba(0,0,0,0.35)"; pc.lineWidth = TW + 70; pc.stroke(T.path);
    pc.strokeStyle = T.theme.asphalt; pc.lineWidth = TW + 20; pc.stroke(T.path);
    pc.strokeStyle = "rgba(255,255,255,0.85)"; pc.lineWidth = 14;
    const p0 = T.pts[0], n0 = T.nrm[0];
    pc.beginPath(); pc.moveTo(p0.x - n0.x * 80, p0.y - n0.y * 80); pc.lineTo(p0.x + n0.x * 80, p0.y + n0.y * 80); pc.stroke();
    pc.restore();
    card.addEventListener("click", () => { selTrack = i; refreshMenu(); });
    tracksEl.appendChild(card);
  });

  function setupSeg(id, get, set) {
    const seg = document.getElementById(id);
    seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { set(b.dataset.v); refreshMenu(); }));
    return () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", String(get()) === b.dataset.v));
  }
  const refreshDiff = setupSeg("diffSeg", () => selDiff, v => selDiff = v);
  const refreshLaps = setupSeg("lapSeg", () => selLaps, v => selLaps = Number(v));

  function bestKey() { return `gpr.best.${selTrack}`; }
  function refreshMenu() {
    tracksEl.querySelectorAll(".track-card").forEach((c, i) => c.classList.toggle("on", i === selTrack));
    refreshDiff(); refreshLaps();
    const b = load(bestKey(), null);
    document.getElementById("bestline").textContent = b ? `Your best lap on ${TRACKS[selTrack].def.name}: ${fmt(b)}` : "";
    save("gpr.track", selTrack); save("gpr.diff", selDiff); save("gpr.laps", selLaps);
  }

  function fmt(t) {
    if (t == null || !isFinite(t)) return "—";
    const m = Math.floor(t / 60), s = t - m * 60;
    return `${m}:${s < 10 ? "0" : ""}${s.toFixed(3)}`;
  }

  // ================= Race state =================
  let T = TRACKS[0];
  let cars = [], player = null;
  let state = "menu";          // menu | countdown | race | done
  let paused = false;
  let cdT = 0, lightsOutAt = 0, raceT = 0, laps = 3, finishOrder = [], doneT = 0;
  let cam = { x: 0, y: 0, a: 0, z: 1 };
  let skids = [];
  let toastText = "", toastT = 0;
  let shake = 0;

  function makeCar(info, slot, isPlayer, mul) {
    const N = T.N;
    const back = 5 + slot * 6;
    const i = (N - back) % N;
    const p = T.pts[i], d = T.dir[i], nr = T.nrm[i];
    const side = slot % 2 === 0 ? -1 : 1;
    return {
      name: info.name, color: info.color, helmet: info.helmet, isPlayer,
      x: p.x + nr.x * side * 26, y: p.y + nr.y * side * 26, h: Math.atan2(d.y, d.x),
      v: 0, steer: 0, idx: i, off: 0, lap: 0, half: true, prog: 0,
      lapStart: 0, lastLap: null, best: null, finished: false, finishTime: null,
      mul, lane: (Math.random() - 0.5) * 30, laneCur: 0, stuckT: 0, grid: slot,
      air: 0, airMax: 1, boostT: 0
    };
  }

  function startRace() {
    T = TRACKS[selTrack];
    laps = selLaps;
    const base = DIFFS[selDiff].mul;
    cars = [];
    const playerSlot = 5;
    let b = 0;
    for (let slot = 0; slot < 8; slot++) {
      if (slot === playerSlot) { player = makeCar(PLAYER, slot, true, 1); cars.push(player); }
      else {
        // Cars higher on the grid are slightly quicker.
        const mul = base * (1.012 - b * 0.006);
        cars.push(makeCar(DRIVERS[b], slot, false, mul)); b++;
      }
    }
    for (const b of T.bumpers) b.hit = 0;
    finishOrder = []; skids = []; raceT = 0; cdT = 0; doneT = 0;
    lightsOutAt = 3.2 + 0.4 + Math.random() * 0.9;
    state = "countdown"; paused = false;
    cam.x = player.x; cam.y = player.y; cam.a = player.h + Math.PI / 2;
    document.getElementById("menu").classList.remove("show");
    document.getElementById("results").classList.remove("show");
    document.getElementById("pause").classList.remove("show");
    toast("");
  }

  function toMenu() {
    state = "menu"; paused = false;
    document.getElementById("pause").classList.remove("show");
    document.getElementById("results").classList.remove("show");
    document.getElementById("menu").classList.add("show");
    refreshMenu();
  }

  function toast(t) { toastText = t; toastT = t ? 1.8 : 0; }

  // ================= Physics & AI =================
  const keys = {};
  const touch = { left: false, right: false, gas: false, brake: false };

  function playerInput() {
    const thr = (keys.ArrowUp || keys.KeyW || touch.gas) ? 1 : 0;
    const brk = (keys.ArrowDown || keys.KeyS || touch.brake) ? 1 : 0;
    const str = ((keys.ArrowRight || keys.KeyD || touch.right) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA || touch.left) ? 1 : 0);
    return { thr, brk, str };
  }

  function angDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function botInput(c, dt) {
    const N = T.N;
    const la = Math.round((46 + Math.abs(c.v) * 0.3) / SP);
    const ti = (c.idx + la) % N;
    // Pick a lateral offset; move aside for a slower car directly ahead.
    let off = c.lane;
    const ch = Math.cos(c.h), sh = Math.sin(c.h);
    // Steer around bumpers coming up on the racing line.
    let dodging = false;
    for (const b of T.bumpers) {
      const ahead = (b.i - c.idx + N) % N;
      if (ahead > 40 && ahead < N - 3) continue;
      if (b.off > 8) off = b.off - 52;
      else if (b.off < -8) off = b.off + 52;
      else off = c.laneCur >= 0 ? 46 : -46;
      dodging = true;
      break;
    }
    if (!dodging) for (const o of cars) {
      if (o === c) continue;
      const dx = o.x - c.x, dy = o.y - c.y;
      const fwd = dx * ch + dy * sh, lat = -dx * sh + dy * ch;
      if (fwd > 0 && fwd < 95 && Math.abs(lat) < 28 && o.v < c.v + 15) { off = lat > 0 ? lat - 40 : lat + 40; break; }
    }
    off = Math.max(-TW * 0.38, Math.min(TW * 0.38, off));
    c.laneCur += (off - c.laneCur) * Math.min(1, dt * (dodging ? 4 : 2.2));
    const tp = T.pts[ti], nr = T.nrm[ti];
    const tx = tp.x + nr.x * c.laneCur, ty = tp.y + nr.y * c.laneCur;
    const desired = Math.atan2(ty - c.y, tx - c.x);
    const str = Math.max(-1, Math.min(1, angDiff(desired, c.h) * 3));

    let vt = Infinity;
    for (let k = 0; k < 6; k++) vt = Math.min(vt, T.prof[(c.idx + k * 3) % N]);
    vt *= c.finished ? 0.55 : c.mul;
    const thr = c.v < vt - 4 ? 1 : 0;
    const brk = c.v > vt + 10 ? Math.min(1, (c.v - vt) / 60) : 0;
    return { thr, brk, str };
  }

  function physics(c, inp, dt) {
    if (c.air > 0) {
      // Airborne: carry momentum with a gentle assist that lines the car up with the road for landing.
      c.air -= dt;
      const d = T.dir[c.idx];
      const turn = angDiff(Math.atan2(d.y, d.x), c.h);
      c.h += Math.max(-1.3 * dt, Math.min(1.3 * dt, turn));
      c.x += Math.cos(c.h) * c.v * dt;
      c.y += Math.sin(c.h) * c.v * dt;
      return;
    }
    const offTrack = c.off > TW / 2 + 4;
    const boosting = c.boostT > 0;
    if (boosting) c.boostT -= dt;
    const vmaxEff = VMAX * (offTrack ? 0.42 : 1) * (boosting ? 1.32 : 1);
    c.steer += (inp.str - c.steer) * Math.min(1, dt * 10);
    if (boosting && !offTrack) c.v += 520 * dt;
    if (inp.thr && c.v >= -5) c.v += ACC * (1 - Math.max(0, c.v) / vmaxEff) * dt;
    if (inp.brk) {
      if (c.v > 5) c.v -= BRK * dt * inp.brk;
      else c.v = Math.max(-140, c.v - 260 * dt);
    }
    if (!inp.thr && !inp.brk) c.v -= Math.sign(c.v) * Math.min(Math.abs(c.v), 90 * dt);
    if (inp.thr && c.v < -5) c.v += BRK * dt;
    c.v -= c.v * 0.05 * dt;
    if (c.v > vmaxEff) c.v -= Math.min(c.v - vmaxEff, 620 * dt);

    const av = Math.abs(c.v);
    const yawMax = Math.min(av / RMIN, ALAT / Math.max(av, 1));
    c.h += c.steer * yawMax * Math.sign(c.v) * dt;
    c.x += Math.cos(c.h) * c.v * dt;
    c.y += Math.sin(c.h) * c.v * dt;

    // Tyre marks when cornering hard.
    if (Math.abs(c.steer) > 0.75 && av > 330 && !offTrack && Math.random() < 0.5) {
      const ch = Math.cos(c.h), sh = Math.sin(c.h);
      for (const s of [-1, 1]) skids.push({ x: c.x - ch * 14 - sh * 8 * s, y: c.y - sh * 14 + ch * 8 * s, a: c.h, t: 6 });
      if (skids.length > 900) skids.splice(0, skids.length - 900);
    }
  }

  function collide() {
    // Bumpers knock cars aside and scrub off speed.
    for (const c of cars) {
      if (c.air > 0) continue;
      for (const b of T.bumpers) {
        const dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy), min = CAR_R + b.r;
        if (d <= 0 || d >= min) continue;
        const nx = dx / d, ny = dy / d;
        c.x = b.x + nx * min; c.y = b.y + ny * min;
        let vx = Math.cos(c.h) * c.v, vy = Math.sin(c.h) * c.v;
        const dot = vx * nx + vy * ny;
        if (dot < 0) {
          vx -= 2 * dot * nx; vy -= 2 * dot * ny;
          const turn = Math.max(-1, Math.min(1, angDiff(Math.atan2(vy, vx), c.h)));
          c.h += turn;
          c.v = Math.max(60, Math.abs(c.v) * 0.6);
          b.hit = 0.35;
          if (c.isPlayer) shake = 0.25;
        }
      }
    }
    for (let i = 0; i < cars.length; i++) {
      for (let j = i + 1; j < cars.length; j++) {
        const a = cars[i], b = cars[j];
        if (a.air > 0 || b.air > 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < CAR_R * 2) {
          const push = (CAR_R * 2 - d) / 2, nx = dx / d, ny = dy / d;
          a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
          // The car running into the other one loses a little speed.
          const aFwd = Math.cos(a.h) * nx + Math.sin(a.h) * ny;
          const bFwd = -(Math.cos(b.h) * nx + Math.sin(b.h) * ny);
          if (aFwd > 0.3) a.v *= 0.97;
          if (bFwd > 0.3) b.v *= 0.97;
        }
      }
    }
  }

  function resetToTrack(c) {
    const i = c.idx, p = T.pts[i], d = T.dir[i];
    c.x = p.x; c.y = p.y; c.h = Math.atan2(d.y, d.x); c.v = 0; c.steer = 0; c.stuckT = 0;
  }

  // Did a car moving from index a to b pass index k?
  function passed(a, b, k) {
    const N = T.N, step = (b - a + N) % N;
    if (step === 0 || step > N / 2) return false;
    const d = (k - a + N) % N;
    return d > 0 && d <= step;
  }
  function inSpan(i, a, b) { return a <= b ? i >= a && i < b : i >= a || i < b; }

  function features(c, prev, idx) {
    for (const j of T.jumps) {
      if (c.air <= 0 && passed(prev, idx, j.ramp) && c.off < TW / 2 + 6) {
        c.airMax = c.air = 0.3 + Math.max(0, c.v) / 2000;
      }
      if (c.air <= 0 && inSpan(idx, j.gap0, j.gap1)) {
        // Came up short: drop back in after the gap.
        const ni = (j.gap1 + 4) % T.N, p = T.pts[ni], d = T.dir[ni];
        c.x = p.x; c.y = p.y; c.h = Math.atan2(d.y, d.x); c.v = 90; c.idx = ni; c.steer = 0;
        if (c.isPlayer) { toast("Missed the jump!"); shake = 0.4; }
        return ni;
      }
    }
    if (c.air <= 0) for (const b of T.boosts) {
      if (passed(prev, idx, b.i) && Math.hypot(c.x - b.x, c.y - b.y) < 40) c.boostT = BOOST_TIME;
    }
    return idx;
  }

  function progress(c) {
    const N = T.N, prev = c.idx;
    let [idx, dist] = nearestIdx(T, c.x, c.y, c.idx);
    c.off = dist;
    idx = features(c, prev, idx);
    c.idx = idx;
    if (idx > N * 0.4 && idx < N * 0.6) c.half = true;
    if (prev > N * 0.85 && idx < N * 0.15 && c.half) {
      c.half = false;
      if (c.lap >= 1) {
        const lt = raceT - c.lapStart;
        c.lastLap = lt;
        if (c.best == null || lt < c.best) c.best = lt;
        if (c.isPlayer && !c.finished) {
          const key = `gpr.best.${selTrack}`;
          const pb = load(key, null);
          if (pb == null || lt < pb) { save(key, lt); toast(`New personal best · ${fmt(lt)}`); }
          else toast(`Lap ${c.lap} · ${fmt(lt)}`);
        }
      }
      c.lap++; c.lapStart = raceT;
      if (c.lap > laps && !c.finished) {
        c.finished = true; c.finishTime = raceT; finishOrder.push(c);
        if (c.isPlayer) { state = "done"; doneT = 0; }
      }
    } else if (prev < N * 0.15 && idx > N * 0.85 && !c.finished) {
      // Reversed back over the line.
      c.lap = Math.max(0, c.lap - 1); c.half = true;
    }
    c.prog = c.lap * N + c.idx;
  }

  function standings() {
    return cars.slice().sort((a, b) => {
      if (a.finished && b.finished) return a.finishTime - b.finishTime;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return b.prog - a.prog;
    });
  }

  function showResults() {
    const order = standings();
    const pos = order.indexOf(player) + 1;
    const winner = order[0];
    document.getElementById("resTrack").textContent = `${T.def.name} · ${DIFFS[selDiff].label} bots · ${laps} laps`;
    document.getElementById("resTitle").textContent = pos === 1 ? "Victory! 🏆" : pos <= 3 ? `Podium! P${pos}` : `Finished P${pos}`;
    document.getElementById("resSub").textContent = player.best ? `Your best lap: ${fmt(player.best)}` : "";
    const body = document.getElementById("resBody");
    body.innerHTML = "";
    order.forEach((c, i) => {
      const tr = document.createElement("tr");
      if (c.isPlayer) tr.className = "me";
      let time;
      if (c.finished) time = i === 0 ? fmt(c.finishTime) : `+${(c.finishTime - winner.finishTime).toFixed(3)}s`;
      else time = c.lap < laps ? `${laps - c.lap + 1} laps left` : "On last lap";
      tr.innerHTML = `<td>P${i + 1}</td><td><span class="chip" style="background:${c.color}"></span>${c.name}</td><td>${time}</td><td>${fmt(c.best)}</td>`;
      body.appendChild(tr);
    });
    document.getElementById("results").classList.add("show");
  }

  function update(dt) {
    if (toastT > 0) toastT -= dt;
    if (shake > 0) shake -= dt;
    for (const b of T.bumpers) if (b.hit > 0) b.hit -= dt;
    for (const s of skids) s.t -= dt;
    if (skids.length && skids[0].t <= 0) skids = skids.filter(s => s.t > 0);
    if (state === "menu" || paused) return;

    if (state === "countdown") {
      cdT += dt;
      if (cdT >= lightsOutAt) { state = "race"; raceT = 0; for (const c of cars) c.lapStart = 0; }
    } else {
      raceT += dt;
      for (const c of cars) {
        const inp = (c.isPlayer && !c.finished) ? playerInput() : botInput(c, dt);
        physics(c, inp, dt);
      }
      collide();
      for (const c of cars) {
        progress(c);
        if (!c.isPlayer || c.finished) {
          c.stuckT = Math.abs(c.v) < 25 ? c.stuckT + dt : 0;
          if (c.stuckT > 2.5) resetToTrack(c);
        }
      }
      if (state === "done") {
        doneT += dt;
        if (doneT > 2 && !document.getElementById("results").classList.contains("show")) showResults();
      }
    }

    // Camera: follow the player with the car pointing up the screen.
    const lead = Math.max(0, player.v) * 0.18;
    const tx = player.x + Math.cos(player.h) * lead, ty = player.y + Math.sin(player.h) * lead;
    const k = Math.min(1, dt * 6);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
    cam.a += angDiff(player.h + Math.PI / 2, cam.a) * Math.min(1, dt * 5);
    const zTarget = Math.min(W, H) / 640 * (1.15 - Math.min(1, Math.abs(player.v) / VMAX) * 0.3);
    cam.z += (zTarget - cam.z) * Math.min(1, dt * 2);
  }

  // ================= Drawing =================
  function drawDeco(type, d) {
    switch (type) {
      case "trees":
        ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.arc(d.x + 5, d.y + 5, d.s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = d.r > 0.5 ? "#1f4d27" : "#28602f"; ctx.beginPath(); ctx.arc(d.x, d.y, d.s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.beginPath(); ctx.arc(d.x - d.s * 0.3, d.y - d.s * 0.3, d.s * 0.5, 0, Math.PI * 2); ctx.fill();
        break;
      case "pines":
        ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.beginPath(); ctx.arc(d.x + 4, d.y + 4, d.s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#2e4d3a";
        ctx.beginPath();
        for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? d.s * 0.55 : d.s; ctx.lineTo(d.x + Math.cos(a) * r, d.y + Math.sin(a) * r); }
        ctx.fill();
        ctx.fillStyle = "#f4f7fa"; ctx.beginPath(); ctx.arc(d.x, d.y, d.s * 0.25, 0, Math.PI * 2); ctx.fill();
        break;
      case "cacti":
        ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.beginPath(); ctx.arc(d.x + 3, d.y + 3, d.s * 0.55, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = d.r > 0.6 ? "#8c6a43" : "#4f7f3a";
        ctx.beginPath(); ctx.arc(d.x, d.y, d.s * 0.5, 0, Math.PI * 2); ctx.fill();
        break;
      case "rocks":
        ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.beginPath(); ctx.arc(d.x + 5, d.y + 5, d.s * 1.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = d.r > 0.5 ? "#7a3e28" : "#8f4c31";
        ctx.beginPath();
        for (let i = 0; i < 7; i++) { const a = d.a + i / 7 * Math.PI * 2, r = d.s * (0.8 + ((i * 37 + d.r2 * 10) % 1) * 0.5); ctx.lineTo(d.x + Math.cos(a) * r, d.y + Math.sin(a) * r); }
        ctx.fill();
        break;
      case "palms":
        ctx.strokeStyle = "#2f7a3a"; ctx.lineWidth = 5; ctx.lineCap = "round";
        for (let i = 0; i < 6; i++) {
          const a = d.a + i / 6 * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + Math.cos(a) * d.s * 1.2, d.y + Math.sin(a) * d.s * 1.2); ctx.stroke();
        }
        ctx.fillStyle = "#6b4b2a"; ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, Math.PI * 2); ctx.fill();
        break;
      case "buildings": {
        const w = d.s, h = d.s * (0.6 + d.r2 * 0.8);
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a);
        ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(-w / 2 + 8, -h / 2 + 8, w, h);
        ctx.fillStyle = "#1e2030"; ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeStyle = d.r > 0.5 ? "#20e3ff" : "#ff2bd6"; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -h / 2, w, h);
        ctx.fillStyle = "rgba(255,230,140,0.55)";
        for (let gx = -w / 2 + 8; gx < w / 2 - 6; gx += 12) for (let gy = -h / 2 + 8; gy < h / 2 - 6; gy += 12) if ((gx * 7 + gy * 13 + d.r * 100) % 3 < 1.2) ctx.fillRect(gx, gy, 4, 4);
        ctx.restore();
        break;
      }
      case "stands": {
        const [i] = nearestIdx(T, d.x, d.y, -1);
        const dir = T.dir[i];
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.atan2(dir.y, dir.x));
        ctx.fillStyle = "#6d7380"; ctx.fillRect(-60, -16, 120, 32);
        const cols = ["#e8112d", "#ffd23f", "#3d5afe", "#ffffff", "#2ecc71"];
        for (let k = 0; k < 40; k++) { ctx.fillStyle = cols[(k * 7 + Math.floor(d.r * 10)) % 5]; ctx.fillRect(-56 + (k % 20) * 5.6, -11 + Math.floor(k / 20) * 11, 3, 3); }
        ctx.restore();
        break;
      }
    }
  }

  function drawCar(c) {
    // Airborne cars grow towards the camera and cast a shadow that drifts away.
    const lift = c.air > 0 ? Math.sin(Math.PI * (1 - c.air / c.airMax)) : 0;
    const s = 1 + lift * 0.45;
    if (lift > 0) {
      ctx.save();
      ctx.translate(c.x + lift * 22, c.y + lift * 22);
      ctx.rotate(c.h);
      ctx.fillStyle = `rgba(0,0,0,${0.3 - lift * 0.12})`;
      ctx.fillRect(-19, -11, 42, 24);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.h);
    ctx.scale(s, s);
    if (c.boostT > 0 && c.air <= 0) {
      // Exhaust flame while boosting
      const fl = 14 + Math.random() * 10;
      ctx.fillStyle = "rgba(0,229,255,0.85)";
      ctx.beginPath(); ctx.moveTo(-21, -4); ctx.lineTo(-21 - fl, 0); ctx.lineTo(-21, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath(); ctx.moveTo(-21, -2); ctx.lineTo(-21 - fl * 0.5, 0); ctx.lineTo(-21, 2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    if (lift <= 0) ctx.fillRect(-19, -11, 42, 24);
    // tyres
    ctx.fillStyle = "#111";
    ctx.fillRect(-16, -13, 11, 6); ctx.fillRect(-16, 7, 11, 6);
    ctx.fillRect(8, -12, 9, 5); ctx.fillRect(8, 7, 9, 5);
    // rear wing
    ctx.fillStyle = "#222"; ctx.fillRect(-21, -10, 5, 20);
    ctx.fillStyle = c.color; ctx.fillRect(-21, -10, 5, 3); ctx.fillRect(-21, 7, 5, 3);
    // body
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.moveTo(-17, -6); ctx.lineTo(2, -7); ctx.lineTo(16, -2.5); ctx.lineTo(24, -1); ctx.lineTo(24, 1); ctx.lineTo(16, 2.5); ctx.lineTo(2, 7); ctx.lineTo(-17, 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(-10, -8, 12, 3); ctx.fillRect(-10, 5, 12, 3);
    // front wing
    ctx.fillStyle = "#222"; ctx.fillRect(21, -11, 4, 22);
    ctx.fillStyle = c.color; ctx.fillRect(21, -11, 4, 3); ctx.fillRect(21, 8, 4, 3);
    // cockpit + helmet
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.ellipse(-1, 0, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.helmet; ctx.beginPath(); ctx.arc(-1, 0, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawWorld() {
    const th = T.theme;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = th.ground;
    ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 24 * shake, (Math.random() - 0.5) * 24 * shake);
    ctx.translate(W / 2, H * 0.64);
    ctx.rotate(-cam.a);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);

    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.strokeStyle = th.runoff; ctx.lineWidth = TW + 120; ctx.stroke(T.path);
    ctx.strokeStyle = th.kerbB; ctx.lineWidth = TW + 18; ctx.stroke(T.path);
    ctx.setLineDash([22, 22]); ctx.lineCap = "butt";
    ctx.strokeStyle = th.kerbA; ctx.lineWidth = TW + 18; ctx.stroke(T.path);
    ctx.setLineDash([]); ctx.lineCap = "round";
    ctx.strokeStyle = th.asphalt; ctx.lineWidth = TW; ctx.stroke(T.path);
    ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 2;
    ctx.save(); ctx.lineWidth = TW - 8; ctx.strokeStyle = "rgba(255,255,255,0.03)"; ctx.stroke(T.path); ctx.restore();
    drawFeatures();

    // Grid boxes
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 3;
    for (let slot = 0; slot < 8; slot++) {
      const i = (T.N - (5 + slot * 6)) % T.N, p = T.pts[i], d = T.dir[i], nr = T.nrm[i];
      const side = slot % 2 === 0 ? -1 : 1;
      const cx = p.x + nr.x * side * 26 + d.x * 24, cy = p.y + nr.y * side * 26 + d.y * 24;
      ctx.beginPath(); ctx.moveTo(cx - nr.x * 14, cy - nr.y * 14); ctx.lineTo(cx + nr.x * 14, cy + nr.y * 14); ctx.stroke();
    }

    // Start / finish chequers
    const p0 = T.pts[0], d0 = T.dir[0], n0 = T.nrm[0];
    ctx.save();
    ctx.translate(p0.x, p0.y);
    ctx.rotate(Math.atan2(d0.y, d0.x));
    const cells = 12, cs = TW / cells;
    for (let r = 0; r < 2; r++) for (let k = 0; k < cells; k++) {
      ctx.fillStyle = (r + k) % 2 ? "#111" : "#fff";
      ctx.fillRect(-cs + r * cs, -TW / 2 + k * cs, cs, cs);
    }
    ctx.restore();

    // Tyre marks
    ctx.fillStyle = "rgba(20,20,20,0.35)";
    for (const s of skids) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
      ctx.globalAlpha = Math.min(1, s.t / 2); ctx.fillRect(-4, -2, 8, 4);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Scenery near the camera
    const viewR = Math.hypot(W, H) / cam.z * 0.75 + 120;
    for (const d of T.deco) {
      if (Math.abs(d.x - cam.x) > viewR || Math.abs(d.y - cam.y) > viewR) continue;
      drawDeco(th.deco, d);
    }

    drawBumpers();
    for (const c of cars) if (!c.isPlayer && c.air <= 0) drawCar(c);
    if (player.air <= 0) drawCar(player);
    for (const c of cars) if (!c.isPlayer && c.air > 0) drawCar(c);
    if (player.air > 0) drawCar(player);
  }

  function drawFeatures() {
    // Canyon gaps cut across the road, with a striped ramp in front of each.
    for (const j of T.jumps) {
      ctx.save();
      ctx.translate(j.cx, j.cy); ctx.rotate(j.a);
      const gl = GAP_PTS * SP;
      ctx.fillStyle = "#5a2a12"; ctx.fillRect(-gl / 2 - 6, -470, gl + 12, 940);
      ctx.fillStyle = "#2b1207"; ctx.fillRect(-gl / 2 + 8, -470, gl - 16, 940);
      ctx.fillStyle = "#130703"; ctx.fillRect(-gl / 2 + 22, -470, gl - 44, 940);
      ctx.restore();
      const p = T.pts[j.ramp], d = T.dir[j.ramp];
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(d.y, d.x));
      ctx.fillStyle = "#ffd23f"; ctx.fillRect(0, -TW / 2, 26, TW);
      ctx.fillStyle = "#1d1d1d";
      for (let k = -TW / 2; k < TW / 2; k += 20) {
        ctx.beginPath(); ctx.moveTo(0, k); ctx.lineTo(10, k); ctx.lineTo(26, k + 10); ctx.lineTo(16, k + 10); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    // Boost pads: glowing chevrons
    const pulse = 0.6 + 0.4 * Math.sin(clock * 8);
    for (const b of T.boosts) {
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.a);
      ctx.fillStyle = `rgba(0,229,255,${0.25 + 0.2 * pulse})`;
      ctx.fillRect(-24, -18, 48, 36);
      ctx.strokeStyle = "#e9fdff"; ctx.lineWidth = 4; ctx.lineJoin = "miter";
      for (const ox of [-14, -2, 10]) {
        ctx.globalAlpha = 0.5 + 0.5 * pulse;
        ctx.beginPath(); ctx.moveTo(ox, -11); ctx.lineTo(ox + 9, 0); ctx.lineTo(ox, 11); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawBumpers() {
    for (const b of T.bumpers) {
      const h = Math.max(0, b.hit) / 0.35;
      const r = b.r * (1 + h * 0.25);
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath(); ctx.arc(b.x + 5, b.y + 5, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = h > 0 ? "#ffffff" : "#ff2bd6";
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(b.x, b.y, r - 2.5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.35, 0, Math.PI * 2); ctx.fill();
      if (h > 0) {
        ctx.strokeStyle = `rgba(255,210,63,${h})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(b.x, b.y, r + 14 * (1 - h) + 6, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function txt(s, x, y, size, col, align = "left", weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = col;
    ctx.fillText(s, x, y);
  }

  function drawHUD() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const small = W < 700;

    // Leaderboard tower
    const order = standings();
    const rowH = 24, bx = 12, by = 12;
    ctx.fillStyle = "rgba(15,17,23,0.82)";
    rr(bx, by, 168, 30 + order.length * rowH, 10); ctx.fill();
    txt(`LAP ${Math.min(Math.max(player.lap, 1), laps)}/${laps}`, bx + 12, by + 16, 13, "#ffd23f");
    order.forEach((c, i) => {
      const y = by + 32 + i * rowH + rowH / 2 - 2;
      if (c.isPlayer) { ctx.fillStyle = "rgba(232,17,45,0.35)"; ctx.fillRect(bx + 4, y - rowH / 2 + 1, 160, rowH - 2); }
      txt(String(i + 1), bx + 20, y, 13, "#9aa0b4", "center");
      ctx.fillStyle = c.color; ctx.fillRect(bx + 32, y - 7, 4, 14);
      txt(c.name, bx + 44, y, 13, "#f1f2f6", "left", c.isPlayer ? 900 : 600);
      if (c.finished) txt("🏁", bx + 152, y, 12, "#fff", "center");
    });

    // Minimap
    const mw = small ? 130 : 190, mh = small ? 90 : 130;
    const mx = W - mw - 12, my = 12;
    ctx.fillStyle = "rgba(15,17,23,0.82)"; rr(mx, my, mw, mh, 10); ctx.fill();
    const sc = Math.min((mw - 20) / (T.maxX - T.minX), (mh - 20) / (T.maxY - T.minY));
    ctx.save();
    ctx.translate(mx + mw / 2 - (T.minX + T.maxX) / 2 * sc, my + mh / 2 - (T.minY + T.maxY) / 2 * sc);
    ctx.scale(sc, sc);
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 3 / sc; ctx.stroke(T.path);
    for (const c of cars) {
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(c.x, c.y, (c.isPlayer ? 5 : 3.5) / sc, 0, Math.PI * 2); ctx.fill();
      if (c.isPlayer) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5 / sc; ctx.stroke(); }
    }
    ctx.restore();

    // Position, speed, times
    const order2 = order.indexOf(player) + 1;
    ctx.fillStyle = "rgba(15,17,23,0.82)";
    rr(W - 176, H - 112, 164, 100, 12); ctx.fill();
    txt(String(Math.round(Math.abs(player.v) * KMH)), W - 30, H - 78, 40, "#fff", "right", 900);
    txt("KM/H", W - 30, H - 48, 11, "#9aa0b4", "right", 700);
    const frac = Math.min(1, Math.abs(player.v) / VMAX);
    ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(W - 164, H - 30, 140, 6);
    ctx.fillStyle = frac > 0.9 ? "#e8112d" : "#ffd23f"; ctx.fillRect(W - 164, H - 30, 140 * frac, 6);
    txt(`P${order2}`, W - 164, H - 78, 30, "#ffd23f", "left", 900);

    ctx.fillStyle = "rgba(15,17,23,0.82)";
    rr(12, H - 88, 190, 76, 12); ctx.fill();
    const cur = state === "race" && player.lap >= 1 && !player.finished ? raceT - player.lapStart : 0;
    txt("LAP", 24, H - 70, 11, "#9aa0b4", "left", 700); txt(fmt(cur), 190, H - 70, 15, "#fff", "right");
    txt("LAST", 24, H - 50, 11, "#9aa0b4", "left", 700); txt(fmt(player.lastLap), 190, H - 50, 15, "#fff", "right", 600);
    txt("BEST", 24, H - 30, 11, "#9aa0b4", "left", 700); txt(fmt(player.best), 190, H - 30, 15, "#b18cff", "right", 700);

    if (state === "race" && player.off > TW / 2 + 4 && !player.finished) {
      txt("OFF TRACK", W / 2, H * 0.2, 20, "#ff7675", "center", 900);
    }
    if (toastT > 0 && toastText) {
      ctx.globalAlpha = Math.min(1, toastT * 2);
      ctx.font = "800 16px system-ui, sans-serif";
      const w = ctx.measureText(toastText).width + 32;
      ctx.fillStyle = "rgba(15,17,23,0.9)"; rr(W / 2 - w / 2, H * 0.12, w, 36, 18); ctx.fill();
      txt(toastText, W / 2, H * 0.12 + 18, 16, "#fff", "center");
      ctx.globalAlpha = 1;
    }

    // Start lights
    if (state === "countdown" || (state === "race" && raceT < 1.2)) {
      const lit = state === "countdown" ? Math.min(5, Math.floor(cdT / 0.65)) : 0;
      const pw = 5 * 46 + 20, px = W / 2 - pw / 2, py = H * 0.18;
      ctx.fillStyle = "rgba(15,17,23,0.92)"; rr(px, py, pw, 66, 12); ctx.fill();
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i < lit ? "#ff1f3d" : "#2a2d3a";
        ctx.beginPath(); ctx.arc(px + 33 + i * 46, py + 33, 16, 0, Math.PI * 2); ctx.fill();
      }
      if (state === "race") txt("GO!", W / 2, py + 100, 40, "#00b894", "center", 900);
    }
    if (state === "done") txt("FINISHED", W / 2, H * 0.3, 44, "#ffd23f", "center", 900);
  }

  function drawMenuBackdrop(t) {
    // Slowly orbit the selected circuit behind the menu.
    const tr = TRACKS[selTrack];
    T = tr;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = tr.theme.ground; ctx.fillRect(0, 0, W, H);
    const sc = Math.min(W / (tr.maxX - tr.minX + 400), H / (tr.maxY - tr.minY + 400));
    ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 0.1) * 0.08);
    ctx.translate(-(tr.minX + tr.maxX) / 2, -(tr.minY + tr.maxY) / 2);
    ctx.lineJoin = "round";
    ctx.strokeStyle = tr.theme.runoff; ctx.lineWidth = TW + 120; ctx.stroke(tr.path);
    ctx.strokeStyle = tr.theme.asphalt; ctx.lineWidth = TW; ctx.stroke(tr.path);
    drawFeatures(); drawBumpers();
    for (const d of tr.deco) drawDeco(tr.theme.deco, d);
  }

  // ================= Loop =================
  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now; clock += dt;
    if (state === "menu") drawMenuBackdrop(clock);
    else {
      // Two physics sub-steps per frame for stability.
      update(dt / 2); update(dt / 2);
      drawWorld(); drawHUD();
    }
    requestAnimationFrame(frame);
  }

  // ================= Input =================
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    if (e.code === "KeyP" && (state === "race" || state === "countdown")) setPaused(!paused);
    if (e.code === "KeyR" && state === "race" && !player.finished) resetToTrack(player);
    if (e.code === "Enter" && state === "menu") startRace();
  });
  addEventListener("keyup", e => { keys[e.code] = false; });
  addEventListener("blur", () => {
    for (const k in keys) keys[k] = false;
    if (state === "race" || state === "countdown") setPaused(true);
  });

  function setPaused(p) {
    paused = p;
    document.getElementById("pause").classList.toggle("show", p);
  }

  const touchEl = document.getElementById("touch");
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) touchEl.classList.add("show");
  touchEl.querySelectorAll(".b").forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); touch[k] = true; b.classList.add("down"); };
    const off = e => { e.preventDefault(); touch[k] = false; b.classList.remove("down"); };
    b.addEventListener("pointerdown", on); b.addEventListener("pointerup", off);
    b.addEventListener("pointercancel", off); b.addEventListener("pointerleave", off);
  });

  document.getElementById("startBtn").addEventListener("click", startRace);
  document.getElementById("againBtn").addEventListener("click", startRace);
  document.getElementById("menuBtn").addEventListener("click", toMenu);
  document.getElementById("resumeBtn").addEventListener("click", () => setPaused(false));
  document.getElementById("restartBtn").addEventListener("click", startRace);
  document.getElementById("quitBtn").addEventListener("click", toMenu);

  refreshMenu();
  requestAnimationFrame(frame);
  window.focus();
})();
</script>
</body>
</html>
