<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FINALS Spectator UI Patch</title>
<style>
:root{--panel:rgba(13,17,23,.86);--line:#232b35;--line2:#364250;--text:#e8edf2;--dim:#8592a0;--accent:#ffcc33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f14;color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.dragging{cursor:grabbing}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}

#topBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 14px;display:flex;gap:16px;align-items:center;white-space:nowrap}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:60px}
.stat small{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
#objective{font-size:12px;font-weight:600;min-width:300px;display:flex;flex-direction:column;gap:3px}
#objective div{display:flex;align-items:center;gap:7px}
#objective i{font-style:normal;font-size:10px;color:#111;background:var(--dim);border-radius:3px;padding:0 4px;font-weight:800}
.sep{width:1px;align-self:stretch;background:var(--line2)}
.btns{display:flex;gap:4px;pointer-events:auto}
button{font:inherit;font-size:12px;background:#1a212a;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;cursor:pointer;pointer-events:auto}
button:hover{background:#25303b}
button.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select{font:inherit;font-size:12px;background:#1a212a;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;cursor:pointer;pointer-events:auto}
button.small{font-size:10px;padding:2px 7px;letter-spacing:.06em}

#mmWrap{position:absolute;left:10px;top:80px;padding:2px;overflow:hidden}
#minimap{width:260px;height:170px;display:block;pointer-events:auto;cursor:crosshair;border-radius:8px}

#scoreboard{position:absolute;right:10px;top:80px;width:330px;padding:10px 12px}
.team{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-left:3px solid var(--c);background:rgba(255,255,255,.035);border-radius:6px;margin-bottom:6px}
.team:last-child{margin-bottom:0}
.rank{color:var(--dim);font-weight:700;font-size:13px}
.tn{color:var(--c);font-weight:700;display:flex;align-items:center;gap:8px}
.ts{font-size:11px;color:var(--dim);margin-top:2px}
.tgt{font-size:11px;color:#b8c2cc;margin-top:1px}
.cash{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.wipe{display:block;font-size:11px;color:#fff;background:#d33;border-radius:4px;padding:1px 5px;margin-top:3px;font-weight:800;letter-spacing:.04em;animation:blink 1s infinite alternate}
@keyframes blink{to{background:#7a1a1a}}
.proj{font-size:11px;color:var(--accent);font-weight:700;margin-top:1px}
.team{position:relative}
.team.rank-up{animation:rankUp 1.6s ease}
.team.rank-down{animation:rankDown 1.6s ease}
.team.rank-up .rank::after{content:'▲';position:absolute;left:3px;top:4px;font-size:9px;color:#7be38f;animation:arrow 1.6s ease forwards}
.team.rank-down .rank::after{content:'▼';position:absolute;left:3px;bottom:4px;font-size:9px;color:#ff6b6b;animation:arrow 1.6s ease forwards}
@keyframes rankUp{0%,30%{background:rgba(123,227,143,.22);box-shadow:0 0 0 1px rgba(123,227,143,.6)}100%{background:rgba(255,255,255,.035);box-shadow:none}}
@keyframes rankDown{0%,30%{background:rgba(255,90,90,.18);box-shadow:0 0 0 1px rgba(255,90,90,.5)}100%{background:rgba(255,255,255,.035);box-shadow:none}}
@keyframes arrow{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.3)}80%{opacity:1;transform:none}100%{opacity:0}}
.pend{display:block;font-size:11px;color:#111;background:var(--accent);border-radius:4px;padding:1px 5px;margin-top:3px;font-weight:700}
.pips{display:inline-flex;gap:3px}
.roster{display:flex;flex-wrap:wrap;gap:3px 8px;margin-top:3px;font-size:11px;color:#d5dce3}
.pl b{font-size:9px;color:var(--c);border:1px solid var(--c);border-radius:3px;padding:0 3px;margin-right:3px}
.gd{display:inline-flex;gap:1px;margin-left:3px;vertical-align:1px}
.gd i{font-style:normal;font-size:8px;font-weight:800;width:10px;height:10px;line-height:10px;text-align:center;border-radius:2px;background:#2a323c;color:#56616d}
.gd i.on{background:#cfd8e2;color:#111}
.pl.dead{opacity:.4;text-decoration:line-through}
.pip{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.pip.down{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c),inset 0 0 0 3px #9aa3ad}
.pip.dead{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:.45}
.pip.carry{background:var(--accent);box-shadow:0 0 6px var(--accent)}

#eventLog{position:absolute;left:10px;bottom:10px;width:390px;height:270px;padding:10px 12px;display:flex;flex-direction:column}
#eventEntries{flex:1;overflow-y:auto;font-size:12px;pointer-events:auto;padding-right:4px}
#eventEntries::-webkit-scrollbar{width:6px}
#eventEntries::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.event{padding:3px 4px 3px 7px;border-bottom:1px solid var(--line);border-left:2px solid transparent;animation:fadeIn .25s ease}
.event time{color:var(--dim);margin-right:7px;font-variant-numeric:tabular-nums}
.event.cash{border-left-color:var(--accent)}
.event.steal{border-left-color:#ff7b39;background:rgba(255,123,57,.07)}
.event.vault{border-left-color:#b48cff}
.event.rotate{color:var(--dim);font-style:italic}
.event.kill{color:#c4ccd5}
.event.major{background:rgba(255,204,51,.08);font-weight:600}
#eventEntries.nokills .event.kill{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

#hint{position:absolute;right:10px;bottom:10px;padding:7px 11px;font-size:11px;color:var(--dim)}
#hint kbd{font-family:inherit;background:#1a212a;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--text)}

#bracket{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;pointer-events:auto;display:none;width:min(1080px,calc(100% - 40px));max-height:calc(100% - 40px);overflow:auto;background:rgba(10,13,18,.95)}
#bracket.show{display:block;animation:fadeIn .3s ease}
#bkHead{text-align:center;margin-bottom:14px}
#bkHead .kick{font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#bkHead .big{font-size:26px;font-weight:800;margin-top:4px}
#bkCols{display:grid;grid-template-columns:1.15fr 1fr 1fr .9fr;gap:14px;align-items:center}
.bcol h4{margin:0 0 6px;font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.bcol .mapn{font-size:11px;color:var(--dim);margin:-4px 0 8px}
.grp{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:8px;padding:8px;margin-bottom:10px}
.grp.live{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,204,51,.3)}
.grp .gt{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.grp .gt b{color:var(--accent);font-weight:700}
.brow{display:grid;grid-template-columns:10px 1fr auto 18px;gap:7px;align-items:center;padding:3px 4px;border-radius:4px;font-size:13px}
.brow .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.brow .nm{color:var(--c);font-weight:700}
.brow .cs{font-variant-numeric:tabular-nums;color:#cfd6dd;font-size:12px}
.brow .ok{color:#7be38f;font-weight:800;text-align:center}
.brow.adv{background:rgba(123,227,143,.08)}
.brow.out{opacity:.4}
.brow.tbd .nm{color:var(--dim);font-weight:400;font-style:italic}
.champ{text-align:center;padding:18px 10px;border:1px dashed var(--line2);border-radius:10px}
.champ .cup{font-size:34px}
.champ .cn{font-size:20px;font-weight:800;margin-top:4px}
#bkFoot{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:16px}
#bkFoot .cd{color:var(--dim);font-size:12px}
#bkFoot button{font-size:14px;padding:8px 16px}
#bkFoot button.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}
.stat.stage{min-width:120px}
.stat.stage small{color:var(--accent)}
.stat.stage b{font-size:14px}
.goal{font-size:10px;color:var(--dim);font-weight:600}
@media (max-width:900px){#bkCols{grid-template-columns:1fr 1fr}}

#director{position:absolute;top:74px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:20px;background:rgba(10,13,18,.78);border:1px solid var(--line2);font-size:12px;font-weight:600;color:#e8edf2;white-space:nowrap;opacity:0;transition:opacity .3s}
#director.show{opacity:1;animation:capIn .45s ease}
@keyframes capIn{from{transform:translate(-50%,-6px);opacity:0}to{transform:translateX(-50%);opacity:1}}
/* ---- Minimal UI: less chrome, more match ---- */
body.minimal #topBar{padding:5px 10px;gap:10px;top:6px;background:rgba(13,17,23,.6)}
body.minimal #speedBtns,body.minimal #camBtn,body.minimal #bracketBtn,body.minimal .stat.stage small,body.minimal #hint,body.minimal #mmWrap{display:none}
body.minimal .stat b{font-size:15px}
body.minimal #objective{min-width:0;font-size:11px}
body.minimal #director{top:56px;font-size:11px;background:rgba(10,13,18,.55)}
body.minimal #scoreboard{width:225px;padding:6px 8px;top:56px;background:rgba(13,17,23,.6)}
body.minimal #scoreboard h3,body.minimal .roster,body.minimal .ts,body.minimal .tgt,body.minimal .goal,body.minimal .proj{display:none}
body.minimal .team{padding:4px 7px;margin-bottom:3px;grid-template-columns:12px 1fr auto}
body.minimal .tn{font-size:13px}
body.minimal .cash{font-size:13px}
body.minimal .pend,body.minimal .wipe{font-size:9px;padding:0 4px;white-space:nowrap}
body.minimal #eventLog{width:300px;height:118px;padding:6px 8px;background:rgba(13,17,23,.45);border-color:transparent;box-shadow:none}
body.minimal #eventLog h3{display:none}
body.minimal .event{font-size:11px;padding:1px 4px;border-bottom:none}
body.minimal .event.kill,body.minimal .event.rotate{display:none}
body.minimal #minBtn{background:var(--accent);color:#111;border-color:var(--accent)}
@media (max-width:1250px){
  #topBar{flex-wrap:wrap;justify-content:center;gap:10px;max-width:calc(100% - 20px)}
  .sep{display:none}
  #scoreboard,#mmWrap{top:150px}
  #hint{display:none}
}
@media (max-width:760px){
  #mmWrap{display:none}
  #scoreboard{width:calc(100% - 20px);top:auto;bottom:190px;padding:8px}
  .team{padding:4px 8px;margin-bottom:3px}
  .tgt{display:none}
  #eventLog{width:calc(100% - 20px);height:170px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topBar" class="panel">
    <div class="stat stage"><small id="stageLbl">Round 1 · Group A</small><b id="stageMap">Canal District</b></div>
    <div class="sep"></div>
    <div class="stat"><small>Match</small><b id="clock">00:00</b></div>
    <div class="stat"><small>Cashouts</small><b><span id="cc">0</span>/<span id="ccMax">6</span></b></div>
    <div class="sep"></div>
    <div id="objective"><div id="obj0"></div><div id="obj1"></div></div>
    <div class="sep"></div>
    <div class="btns" id="speedBtns"></div>
    <div class="btns">
      <button id="pauseBtn" title="Pause / resume (Space)">❚❚ Pause</button>
      <button id="camBtn" class="active" title="Auto camera (C) · cycle objective focus (F)">Auto cam</button>
      <button id="bracketBtn" title="Show tournament bracket (B)">🏆 Bracket</button>
      <button id="minBtn" title="Minimal UI for viewing (H)">◱ Minimal UI</button>
    </div>
  </div>
  <div id="director"></div>
  <div id="mmWrap" class="panel"><canvas id="minimap" title="Click to move the camera"></canvas></div>
  <div id="scoreboard" class="panel"><h3>Scoreboard</h3><div id="sbRows"></div></div>
  <div id="eventLog" class="panel">
    <h3>Event log <button id="killToggle" class="small">Hide kills</button></h3>
    <div id="eventEntries" aria-live="polite"></div>
  </div>
  <div id="hint" class="panel"><kbd>Space</kbd> pause · <kbd>1</kbd>–<kbd>6</kbd> speed · <kbd>C</kbd> auto cam · <kbd>F</kbd> focus objective · <kbd>B</kbd> bracket · <kbd>H</kbd> minimal UI · drag / wheel<br>Gadget: <b>F</b> frag · <b>G</b> gas · <b>W</b> gateway (lit = ready)</div>
  <div id="bracket" class="panel">
    <div id="bkHead"></div>
    <div id="bkCols"></div>
    <div id="bkFoot"></div>
  </div>
</div>

const money = n => '$' + Math.round(n).toLocaleString('en-US');

      { x: 0, y: 0, w: 1100, h: 1000, c: '#1c1915', label: 'OLD TOWN', lx: 330, ly: 390 },

function closestAlive(team, pt) {

  else if (killer.team === victim.team) addLog([P(killer), ` [${tag}] took out teammate `, P(victim), ' — friendly fire!'], 'kill');
  else {

      c.strokeStyle = '#4c535c'; c.lineWidth = 3; c.beginPath(); c.arc(x + w / 2, y + h / 2, r0 * .65, 0, TAU); c.stroke();
      c.fillStyle = '#ff8a2a'; c.beginPath(); c.arc(x + w / 2, y + h / 2, 4, 0, TAU); c.fill();
      return;
    }
    default: {
      const pal = { old: ['#2c241e', '#3a2f27', '#4a3b30'], warehouse: ['#252b31', '#2f363e', '#3a434c'], block: ['#20262f', '#2a313c', '#343d4a'] }[kind];
      if (!pal) break;
      c.fillStyle = pal[0]; c.fillRect(x, y, w, h);
      c.fillStyle = pal[1]; c.fillRect(x + 7, y + 7, w - 14, h - 14);
      c.strokeStyle = pal[2]; c.lineWidth = 2;
      if (kind === 'old') { // ridge roof + chimney
        c.beginPath(); c.moveTo(x + 7, y + h / 2); c.lineTo(x + w - 7, y + h / 2); c.stroke();
        c.fillStyle = '#563f33'; c.fillRect(x + w * .7, y + 14, 14, 14);
      } else if (kind === 'warehouse') {
        c.beginPath(); for (let i = x + 20; i < x + w - 7; i += 20) { c.moveTo(i, y + 7); c.lineTo(i, y + h - 7); } c.stroke();
      } else { // rooftop units

}

function drawLiquid(c, k, mini, lava) {
  const col = lava ? ['#2a0a02', '#c23400', '#ff7a1a'] : ['#0c2433', '#0f3448', '#13425a'];
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const rv of RIVERS) {
    c.strokeStyle = col[0]; c.lineWidth = rv.w + 18; polyline(c, rv.pts); c.stroke();
    c.strokeStyle = col[1]; c.lineWidth = rv.w; polyline(c, rv.pts); c.stroke();
    c.strokeStyle = col[2]; c.lineWidth = rv.w - 40; polyline(c, rv.pts); c.stroke();
  }
  for (const [x, y, r] of PONDS) [[r + 9, 0], [r, 1], [r - 25, 2]].forEach(([rr, i]) => { c.fillStyle = col[i]; c.beginPath(); c.arc(x, y, rr, 0, TAU); c.fill(); });
  for (const g of RINGS) {
    const mid = (g.r1 + g.r2) / 2, w = g.r2 - g.r1;
    [[w + 18, 0], [w, 1], [w - 50, 2]].forEach(([lw, i]) => { c.strokeStyle = col[i]; c.lineWidth = lw; c.beginPath(); c.arc(g.x, g.y, mid, 0, TAU); c.stroke(); });
  }
  if (mini) { c.lineCap = 'butt'; return; }
  // Animated surface
  c.strokeStyle = lava ? 'rgba(255,220,120,.35)' : 'rgba(120,200,240,.18)'; c.lineWidth = 3; c.setLineDash(lava ? [10, 34] : [18, 40]);
  for (const rv of RIVERS) {
    c.lineDashOffset = -time * (lava ? 12 : 30); polyline(c, rv.pts); c.stroke();
    c.lineDashOffset = -time * (lava ? 9 : 22) + 20; c.save(); c.translate(14, 0); polyline(c, rv.pts); c.stroke(); c.restore();
  }
  for (const g of RINGS) for (let i = 0; i < 3; i++) {
    c.lineDashOffset = -time * (8 + i * 4) * (i % 2 ? 1 : -1);
    c.beginPath(); c.arc(g.x, g.y, g.r1 + 30 + i * 45, 0, TAU); c.stroke();
  }
  for (const [x, y, r] of PONDS) { c.lineDashOffset = -time * 10; c.beginPath(); c.arc(x, y, r * .55, 0, TAU); c.stroke(); }
  c.setLineDash([]); c.lineDashOffset = 0; c.lineCap = 'butt';
  if (lava) { // heat glow + bubbles
    for (const g of RINGS) {
      const gr = c.createRadialGradient(g.x, g.y, g.r2 - 20, g.x, g.y, g.r2 + 90);
      gr.addColorStop(0, 'rgba(255,90,0,.22)'); gr.addColorStop(1, 'rgba(255,90,0,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(g.x, g.y, g.r2 + 90, 0, TAU); c.fill();
      for (let i = 0; i < 10; i++) {
        const a = i * 2.39 + Math.floor(time * .7 + i) * 1.3, rr = g.r1 + 25 + ((i * 53) % (g.r2 - g.r1 - 50)), ph = (time * .7 + i) % 1;
        c.fillStyle = `rgba(255,210,110,${.5 * (1 - ph)})`; c.beginPath(); c.arc(g.x + Math.cos(a) * rr, g.y + Math.sin(a) * rr, 4 + ph * 9, 0, TAU); c.fill();
      }
    }
    for (const [x, y, r] of PONDS) {
      const gr = c.createRadialGradient(x, y, r - 10, x, y, r + 70);
      gr.addColorStop(0, 'rgba(255,90,0,.2)'); gr.addColorStop(1, 'rgba(255,90,0,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(x, y, r + 70, 0, TAU); c.fill();
    }
  }
}

function drawBridges(c, k, mini) {
  const lava = MAP.theme === 'foundry', warn = bridgeWarn(), blink = Math.floor(performance.now() / 250) % 2;
  for (const b of BRIDGES) {
    const { x, y, w, h } = b, vertical = h > w;
    if (b.up) { // retracted: just the two stubs with hazard lights
      const s = 26;
      c.fillStyle = '#3a3f46';
      if (vertical) { c.fillRect(x, y, w, s); c.fillRect(x, y + h - s, w, s); } else { c.fillRect(x, y, s, h); c.fillRect(x + w - s, y, s, h); }
      if (!mini) {
        c.fillStyle = warn && blink ? '#ffcc33' : '#ff3b2f';
        const pts = vertical ? [[x + 8, y + s], [x + w - 8, y + s], [x + 8, y + h - s], [x + w - 8, y + h - s]]
                             : [[x + s, y + 8], [x + s, y + h - 8], [x + w - s, y + 8], [x + w - s, y + h - 8]];
        for (const [px, py] of pts) { c.beginPath(); c.arc(px, py, 5, 0, TAU); c.fill(); }
        c.fillStyle = 'rgba(255,220,180,.85)'; c.font = '700 11px "Segoe UI",system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(warn ? 'LOWERING' : 'RAISED', x + w / 2, y + h / 2);
      }
      continue;
    }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x + 6, y + 10, w, h);
    c.fillStyle = lava ? '#565c64' : '#4a3a2c'; c.fillRect(x, y, w, h);
    if (mini) continue;
    c.strokeStyle = lava ? '#40454c' : '#3a2d22'; c.lineWidth = 2; c.beginPath();
    if (vertical) for (let i = y + 10; i < y + h; i += 12) { c.moveTo(x + 4, i); c.lineTo(x + w - 4, i); }
    else for (let i = x + 10; i < x + w; i += 12) { c.moveTo(i, y + 4); c.lineTo(i, y + h - 4); }
    c.stroke();
    c.fillStyle = lava ? '#7d848c' : '#6b5442';
    if (vertical) { c.fillRect(x, y, 5, h); c.fillRect(x + w - 5, y, 5, h); } else { c.fillRect(x, y, w, 5); c.fillRect(x, y + h - 5, w, 5); }
    if (b.group !== undefined && warn) { // about to rise
      c.strokeStyle = blink ? '#ffcc33' : '#ff3b2f'; c.lineWidth = 4; c.setLineDash([12, 10]); c.strokeRect(x + 2, y + 2, w - 4, h - 4); c.setLineDash([]);
    }
  }
}

function drawVents(c, k) {
  const now = performance.now();
  for (const v of VENTS) {
    const st = ventState(v);
    c.fillStyle = '#1b1714'; c.beginPath(); c.arc(v.x, v.y, v.r, 0, TAU); c.fill();
    c.strokeStyle = '#3a332d'; c.lineWidth = 4; c.beginPath();
    for (let i = -2; i <= 2; i++) { c.moveTo(v.x - v.r * .7, v.y + i * 14); c.lineTo(v.x + v.r * .7, v.y + i * 14); } c.stroke();
    c.strokeStyle = st === 'idle' ? '#4a3a2c' : '#ff8a2a'; c.lineWidth = 3 / k; c.beginPath(); c.arc(v.x, v.y, v.r, 0, TAU); c.stroke();
    if (st === 'warn') {
      c.fillStyle = `rgba(255,120,20,${.15 + .15 * Math.sin(now / 80)})`; c.beginPath(); c.arc(v.x, v.y, v.r, 0, TAU); c.fill();
    } else if (st === 'active') {
      const gr = c.createRadialGradient(v.x, v.y, 4, v.x, v.y, v.r + 10);
      gr.addColorStop(0, 'rgba(255,240,180,.95)'); gr.addColorStop(.5, 'rgba(255,120,20,.7)'); gr.addColorStop(1, 'rgba(200,40,0,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(v.x, v.y, v.r + 10, 0, TAU); c.fill();
      for (let i = 0; i < 8; i++) {
        const a = i * .785 + now / 200, rr = (now / 6 + i * 23) % v.r;
        c.fillStyle = 'rgba(255,200,90,.8)'; c.beginPath(); c.arc(v.x + Math.cos(a) * rr, v.y + Math.sin(a) * rr, 3, 0, TAU); c.fill();
      }
    }
    if (st !== 'idle') {
      c.fillStyle = '#ffb36b'; c.font = `700 ${10 / k}px "Segoe UI",system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(st === 'warn' ? 'VENT ERUPTING' : 'VENT', v.x, v.y - v.r - 10);
    }
  }
}

function drawMap(c, k, mini) {
  const foundry = MAP.theme === 'foundry';
  c.fillStyle = foundry ? '#141110' : '#11161c'; c.fillRect(0, 0, W, H);
  for (const d of DISTRICTS) { c.fillStyle = d.c; c.fillRect(d.x, d.y, d.w, d.h); }
  if (!mini) {
    c.strokeStyle = foundry ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.025)'; c.lineWidth = 1 / k; c.beginPath();
    const step = foundry ? 80 : 100;
    for (let x = 0; x <= W; x += step) { c.moveTo(x, 0); c.lineTo(x, H); }
    for (let y = 0; y <= H; y += step) { c.moveTo(0, y); c.lineTo(W, y); }
    c.stroke();
    if (foundry) { // rivets on floor plates
      c.fillStyle = 'rgba(255,255,255,.05)';
      for (let x = 80; x < W; x += 80) for (let y = 80; y < H; y += 80) c.fillRect(x - 2, y - 2, 4, 4);
    }
  }
  // Rails
  if (RAILS.length) {
    c.strokeStyle = '#2b2f35'; c.lineWidth = mini ? 2 : 4;
    for (const ry of RAILS) { c.beginPath(); c.moveTo(1780, ry - 9); c.lineTo(W, ry - 9); c.moveTo(1780, ry + 9); c.lineTo(W, ry + 9); c.stroke(); }
    if (!mini) {
      c.strokeStyle = '#24282d'; c.lineWidth = 5; c.beginPath();
      for (const ry of RAILS) for (let x = 1790; x < W; x += 22) { c.moveTo(x, ry - 15); c.lineTo(x, ry + 15); }
      c.stroke();
    }
  }
  // Roads / catwalks
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = foundry ? '#26231f' : '#1a2028'; c.lineWidth = foundry ? 50 : 56;
  for (const r of ROADS) { polyline(c, r); c.stroke(); }
  if (!mini) {
    if (foundry) {
      c.strokeStyle = 'rgba(255,170,60,.13)'; c.lineWidth = 2; c.setLineDash([4, 6]);
      for (const r of ROADS) for (const off of [-20, 20]) { c.save(); c.translate(0, off); polyline(c, r); c.stroke(); c.restore(); }
      c.setLineDash([]);
    } else {
      c.strokeStyle = 'rgba(255,214,90,.16)'; c.lineWidth = 2.5; c.setLineDash([26, 22]);
      for (const r of ROADS) { polyline(c, r); c.stroke(); }
      c.setLineDash([]);
    }
  }
  // Pipes
  for (const pp of PIPES) {
    c.strokeStyle = '#2f3338'; c.lineWidth = 22; polyline(c, pp); c.stroke();
    if (!mini) { c.strokeStyle = '#454b52'; c.lineWidth = 7; polyline(c, pp); c.stroke(); }
  }
  // Trees (park canopy)
  if (!mini) for (const [x, y, r] of TREES) {
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.arc(x + 8, y + 10, r, 0, TAU); c.fill();
    c.fillStyle = '#1e3d29'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.fillStyle = '#285a36'; c.beginPath(); c.arc(x - r * .25, y - r * .25, r * .55, 0, TAU); c.fill();
  }
  drawLiquid(c, k, mini, foundry);
  // Island core plate
  if (!mini) for (const g of RINGS) {
    c.strokeStyle = '#4a3a2c'; c.lineWidth = 6; c.beginPath(); c.arc(g.x, g.y, g.r1 - 6, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,140,40,.25)'; c.lineWidth = 2; c.setLineDash([8, 8]); c.beginPath(); c.arc(g.x, g.y, g.r1 - 30, 0, TAU); c.stroke(); c.setLineDash([]);
  }
  drawBridges(c, k, mini);
  if (!mini) drawVents(c, k);
  for (const b of BUILDINGS) drawBuilding(c, b, k, mini);
  // Spawn pads
  TSPAWN.forEach((s, i) => {
    c.fillStyle = alpha(TEAMS[i].color, .1); c.beginPath(); c.arc(s.x, s.y, 70, 0, TAU); c.fill();
    if (!mini) { c.strokeStyle = alpha(TEAMS[i].color, .35); c.lineWidth = 2; c.setLineDash([6, 8]); c.stroke(); c.setLineDash([]); }
  });
  c.strokeStyle = foundry ? '#3a2f26' : '#2c3845'; c.lineWidth = 3 / k; c.strokeRect(0, 0, W, H);
  if (!mini) {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '900 64px "Segoe UI",system-ui,sans-serif'; c.fillStyle = foundry ? 'rgba(255,170,90,.05)' : 'rgba(255,255,255,.045)';
    for (const d of DISTRICTS) c.fillText(d.label, d.lx, d.ly);
  }
}

function drawOverheads(c, k) {
  const now = performance.now();
  // Crane jib swings slowly over the construction site (drawn above players for depth)
  const b = BUILDINGS.find(b => b.kind === 'crane');
  if (b) {
    const ox = b.x + b.w / 2, oy = b.y + b.h / 2, a = 2.6 + Math.sin(time * .08) * .5;
    c.save(); c.globalAlpha = .55;
    c.strokeStyle = '#ffcc33'; c.lineWidth = 10; c.beginPath();
    c.moveTo(ox - Math.cos(a) * 70, oy - Math.sin(a) * 70); c.lineTo(ox + Math.cos(a) * 330, oy + Math.sin(a) * 330); c.stroke();
    c.strokeStyle = '#7a5f00'; c.lineWidth = 2; c.setLineDash([6, 6]); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#555'; c.fillRect(ox - Math.cos(a) * 70 - 14, oy - Math.sin(a) * 70 - 14, 28, 28);
    c.restore();
  }
  // Furnace smoke drifting over the foundry
  for (const f of BUILDINGS) if (f.kind === 'furnace') for (let i = 0; i < 4; i++) {
    const t = ((now / 4000) + i / 4 + f.seed * .13) % 1;
    c.fillStyle = `rgba(60,55,50,${.35 * (1 - t)})`;
    c.beginPath(); c.arc(f.x + f.w * .7 + t * 60, f.y + 20 - t * 90, 14 + t * 30, 0, TAU); c.fill();
  }
}

function draw() {
  const k = viewScale(), now = performance.now();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b0f14'; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (cw / 2 - cam.x * k), dpr * (ch / 2 - cam.y * k));
  drawMap(ctx, k, false);
  const font = px => `600 ${px / k}px "Segoe UI",system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // Vaults
  VAULTS.forEach((v, i) => {
    const slot = slots.find(s => s.vault === i && !s.station);
    const open = slot && slot.box && !slot.box.carrier && slot.box.x === v.x && slot.box.y === v.y;
    const soon = slot && !isLive(slot);
    ctx.fillStyle = open ? '#2b2140' : '#171d25'; ctx.strokeStyle = open ? '#b48cff' : soon ? '#7a62a8' : '#3a4654'; ctx.lineWidth = 3 / k;
    ctx.fillRect(v.x - 26, v.y - 26, 52, 52); ctx.strokeRect(v.x - 26, v.y - 26, 52, 52);
    ctx.beginPath(); ctx.arc(v.x, v.y, 12, 0, TAU); ctx.stroke();
    if (soon) {
      ctx.strokeStyle = '#b48cff'; ctx.lineWidth = 5; ctx.beginPath();
      ctx.arc(v.x, v.y, 40, -Math.PI / 2, -Math.PI / 2 + TAU * Math.max(0, 1 - slot.timer / 10)); ctx.stroke();
    }
    ctx.fillStyle = open || soon ? '#cdb8ff' : '#6f7c8a'; ctx.font = font(10);
    ctx.fillText((v.name + ' vault').toUpperCase() + (soon ? ' · ' + Math.ceil(slot.timer) + 's' : ''), v.x, v.y + 42);
  });
  // Cashout stations
  STATIONS.forEach((st, i) => {
    const slot = slots.find(s => s.station && s.station.idx === i), act = slot && slot.station;
    const dest = slots.some(s => s.box && s.box.carrier && s.box.dest === i);
    if (act) {
      const col = TEAMS[act.team].color;
      ctx.fillStyle = alpha(col, .14 + (act.contest ? .06 * Math.sin(now / 120) : 0)); ctx.beginPath(); ctx.arc(st.x, st.y, STATION_R, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 7; ctx.beginPath();
      ctx.arc(st.x, st.y, STATION_R - 4, -Math.PI / 2, -Math.PI / 2 + TAU * act.progress); ctx.stroke();
      if (act.stealTeam >= 0) {
        ctx.strokeStyle = TEAMS[act.stealTeam].color; ctx.lineWidth = 4; ctx.beginPath();
        ctx.arc(st.x, st.y, STATION_R + 9, -Math.PI / 2, -Math.PI / 2 + TAU * act.steal); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(st.x - 12, st.y - 12, 24, 24);
    ctx.setLineDash([10 / k, 7 / k]);
    ctx.strokeStyle = act ? alpha(TEAMS[act.team].color, .6) : dest ? '#ffcc33' : '#3e4b59';
    ctx.lineWidth = (dest ? 3 : 1.5) / k;
    ctx.beginPath(); ctx.arc(st.x, st.y, STATION_R, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = act ? '#fff' : dest ? '#ffcc33' : '#7d8a98'; ctx.font = font(act ? 15 : 11);
    ctx.fillText(act ? Math.floor(act.progress * 100) + '%' : 'CASHOUT', st.x, st.y);
    ctx.font = font(10); ctx.fillStyle = act ? alpha(TEAMS[act.team].color, .9) : '#6f7c8a';
    ctx.fillText(act ? `${TEAMS[act.team].name.toUpperCase()} · +${money(act.value)}` : st.name.toUpperCase(), st.x, st.y + STATION_R + 14);
  });
  // Gas clouds
  for (const c of clouds) {
    const fade = Math.min(1, c.left / 1.2, (GADGETS.gas.dur - c.left) / .4 + .2);
    const gr = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, c.r);
    gr.addColorStop(0, `rgba(150,230,60,${.55 * fade})`); gr.addColorStop(1, `rgba(110,200,40,${.24 * fade})`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
    for (let i = 0; i < 7; i++) {
      const a = i / 7 * TAU + time * .4 * (i % 2 ? 1 : -1), rr = c.r * (.35 + .3 * ((i * 37) % 10) / 10);
      ctx.fillStyle = `rgba(170,240,90,${.22 * fade})`; ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, c.r * .32, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = `rgba(180,255,90,${.6 * fade})`; ctx.lineWidth = 2 / k; ctx.setLineDash([5 / k, 5 / k]);
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#d6ff9a'; ctx.font = font(10); ctx.fillText('GAS ' + Math.ceil(c.left) + 's', c.x, c.y - c.r - 8);
  }
  // Gateways
  for (const g of gates) {
    const col = TEAMS[g.team].color, fade = Math.min(1, g.left / .8);
    ctx.globalAlpha = fade;
    ctx.strokeStyle = alpha(col, .25); ctx.lineWidth = 2 / k; ctx.setLineDash([3 / k, 9 / k]); ctx.lineDashOffset = -now / 40;
    ctx.beginPath(); ctx.moveTo(g.a.x, g.a.y); ctx.lineTo(g.b.x, g.b.y); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
    for (const e of [g.a, g.b]) {
      const gr = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, 26);
      gr.addColorStop(0, '#ffffffcc'); gr.addColorStop(.45, alpha(col, .55)); gr.addColorStop(1, alpha(col, 0));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(e.x, e.y, 26, 0, TAU); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) { const a = now / 300 + i * TAU / 3; ctx.beginPath(); ctx.arc(e.x, e.y, 20, a, a + 1.2); ctx.stroke(); }
    }
    ctx.fillStyle = col; ctx.font = font(9); ctx.fillText('GATEWAY ' + Math.ceil(g.left) + 's', g.b.x, g.b.y - 34);
    ctx.globalAlpha = 1;
  }
  // Tracers (real-time fade so they read at any speed)
  shots = shots.filter(s => now - s.born < 140);
  for (const s of shots) {
    const f = 1 - (now - s.born) / 140;
    ctx.lineWidth = (s.w === 'DMR' ? 3.2 : s.w === 'SG' ? 1.2 : 1.8) / k;
    ctx.strokeStyle = s.w === 'DMR' ? `rgba(255,255,255,${.9 * f})` : alpha(s.c, .85 * f);
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    if (s.w === 'DMR') { ctx.lineWidth = 1.4 / k; ctx.strokeStyle = alpha(s.c, f); ctx.stroke(); }
  }
  // Players
  for (const p of players) {
    const col = TEAMS[p.team].color;
    if (!p.alive && p.statue) { // revivable statue
      const x = p.deathX, y = p.deathY, rr = p.carriedBy ? 7 : 10;
      ctx.fillStyle = '#9aa3ad'; ctx.strokeStyle = col; ctx.lineWidth = 2.5 / k;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = alpha(col, .8); ctx.beginPath(); ctx.arc(x, y, rr * .45, 0, TAU); ctx.fill();
      if (p.reviveProg > 0) {
        ctx.strokeStyle = '#7be38f'; ctx.lineWidth = 3.5; ctx.beginPath();
        ctx.arc(x, y, rr + 6, -Math.PI / 2, -Math.PI / 2 + TAU * p.reviveProg); ctx.stroke();
      }
      ctx.fillStyle = alpha(col, .85); ctx.font = font(9);
      ctx.fillText(p.reviveProg > 0 ? 'REVIVING' : p.carriedBy ? '' : Math.ceil(p.respawn) + 's', x, y + rr + 10);
      continue;
    }
    if (!p.alive) {
      ctx.strokeStyle = alpha(col, .5); ctx.lineWidth = 2 / k; const x = p.deathX, y = p.deathY;
      ctx.beginPath(); ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6); ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6); ctx.stroke();
      ctx.fillStyle = alpha(col, .7); ctx.font = font(10); ctx.fillText(Math.ceil(p.respawn) + 's', x, y + 16);
      continue;
    }
    if (p.gasTime > .1) { ctx.strokeStyle = '#b4ff5a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, TAU); ctx.stroke(); }
    if (p.carrying) { ctx.fillStyle = '#7be38f'; ctx.font = font(9); ctx.fillText('CARRYING ' + p.carrying.name.toUpperCase(), p.x, p.y - 29); }
    if (p.flee > 0) { ctx.fillStyle = '#9fe0ff'; ctx.font = font(9); ctx.fillText('RETREATING', p.x, p.y - 29); }
    if (carriedSlot(p)) { ctx.fillStyle = 'rgba(255,204,51,.25)'; ctx.beginPath(); ctx.arc(p.x, p.y, 21, 0, TAU); ctx.fill(); }
    ctx.fillStyle = col; ctx.strokeStyle = '#0b0f14'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#0b0f14'; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.ang) * 10, p.y + Math.sin(p.ang) * 10); ctx.stroke();
    ctx.fillStyle = '#000a'; ctx.fillRect(p.x - 13, p.y - 21, 26, 4);
    ctx.fillStyle = p.hp > 50 ? '#7be38f' : p.hp > 25 ? '#ffc94a' : '#ff5a5a';
    ctx.fillRect(p.x - 13, p.y - 21, 26 * p.hp / 100, 4);
    ctx.fillStyle = '#0b0f14'; ctx.font = `800 ${p.weapon === 'DMR' ? 6 : 7}px "Segoe UI",system-ui,sans-serif`;
    ctx.fillText(WEAPONS[p.weapon].tag, p.x, p.y + .5);
    if (k > .75) { ctx.fillStyle = alpha('#ffffff', .8); ctx.font = font(10); ctx.fillText(p.name, p.x, p.y + 20); }
  }
  // Cash boxes
  for (const s of slots) if (s.box) {
    const b = s.box, bx = b.x, by = b.carrier ? b.y - 32 : b.y, pulse = 1 + .12 * Math.sin(now / 160);
    ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.PI / 4); ctx.scale(pulse, pulse);
    ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffcc33'; ctx.strokeStyle = '#5a4300'; ctx.lineWidth = 2;
    ctx.fillRect(-8, -8, 16, 16); ctx.strokeRect(-8, -8, 16, 16); ctx.restore();
    ctx.fillStyle = '#ffcc33'; ctx.font = font(11); ctx.fillText(money(b.value), bx, by - 18);
  }
  // Wiped squads: countdown on their spawn pad
  TSPAWN.forEach((sp, t) => {
    if (!stats[t].wiped) return;
    const left = Math.ceil(players.find(p => p.team === t).respawn);
    ctx.strokeStyle = TEAMS[t].color; ctx.lineWidth = 6; ctx.beginPath();
    ctx.arc(sp.x, sp.y, 62, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - left / WIPE_RESPAWN)); ctx.stroke();
    ctx.fillStyle = '#ff6b6b'; ctx.font = font(13); ctx.fillText('WIPED', sp.x, sp.y - 9);
    ctx.fillStyle = '#fff'; ctx.font = font(18); ctx.fillText(left + 's', sp.x, sp.y + 11);
  });
  // Grenades in flight (with a little arc) + explosions / warps
  for (const pr of projectiles) {
    const t = Math.min(1, pr.t / pr.fuse), x = pr.x0 + (pr.x1 - pr.x0) * t, y = pr.y0 + (pr.y1 - pr.y0) * t, h = Math.sin(t * Math.PI) * 45;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = pr.kind === 'frag' ? (Math.floor(now / 90) % 2 ? '#ff4040' : '#2a2a2a') : '#9be04a';
    ctx.strokeStyle = '#0b0f14'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y - h, 5.5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  fx = fx.filter(f => now - f.born < (f.kind === 'blast' ? 450 : 300));
  for (const f of fx) {
    const t = Math.max(0, (now - f.born) / (f.kind === 'blast' ? 450 : 300));
    if (f.kind === 'blast') {
      ctx.fillStyle = `rgba(255,170,60,${.45 * (1 - t)})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (.4 + .6 * t), 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(255,230,160,${1 - t})`; ctx.lineWidth = 4 / k; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * t, 0, TAU); ctx.stroke();
    } else {
      ctx.strokeStyle = alpha(f.c, 1 - t); ctx.lineWidth = 3 / k; ctx.beginPath(); ctx.arc(f.x, f.y, 8 + 22 * t, 0, TAU); ctx.stroke();
    }
  }
  drawOverheads(ctx, k);
  // Objective number tags
  slots.forEach((s, i) => {
    if (s.idle) return;
    const pt = slotPoint(s), y = pt.y - (s.station ? STATION_R + 24 : 58);
    ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(pt.x, y, 11 / k, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = `800 ${12 / k}px "Segoe UI",system-ui,sans-serif`; ctx.fillText(i + 1, pt.x, y + .5 / k);
  });
  if (paused && !over) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#fff'; ctx.font = '800 34px "Segoe UI",system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', cw / 2, ch / 2);
  }
}

function buildMinimapStatic() {
  mmStatic = document.createElement('canvas');
  mmStatic.width = mm.width; mmStatic.height = mm.height;
  const c = mmStatic.getContext('2d'), k = mmScale();
  c.fillStyle = '#0b0f14'; c.fillRect(0, 0, mm.width, mm.height);
  c.setTransform(dpr * k, 0, 0, dpr * k, dpr * (MMW - W * k) / 2, dpr * (MMH - H * k) / 2);
  drawMap(c, k, true);
}
function drawMinimap() {
  const k = mmScale();
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.drawImage(mmStatic, 0, 0);
  mctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (MMW - W * k) / 2, dpr * (MMH - H * k) / 2);
  STATIONS.forEach((s, i) => {
    const act = slots.find(o => o.station && o.station.idx === i);
    mctx.strokeStyle = act ? TEAMS[act.station.team].color : '#4a5866'; mctx.lineWidth = (act ? 2.5 : 1) / k;
    mctx.beginPath(); mctx.arc(s.x, s.y, STATION_R, 0, TAU); mctx.stroke();
  });
  for (const s of slots) if (!isLive(s) && s.vault >= 0) {
    const v = VAULTS[s.vault]; mctx.strokeStyle = '#b48cff'; mctx.lineWidth = 2 / k; mctx.strokeRect(v.x - 30, v.y - 30, 60, 60);
  }
  for (const p of players) if (p.alive) {
    mctx.fillStyle = TEAMS[p.team].color; mctx.beginPath(); mctx.arc(p.x, p.y, 3.2 / k, 0, TAU); mctx.fill();
  }
  for (const c of clouds) { mctx.fillStyle = 'rgba(160,240,70,.45)'; mctx.beginPath(); mctx.arc(c.x, c.y, c.r, 0, TAU); mctx.fill(); }
  for (const g of gates) {
    mctx.strokeStyle = TEAMS[g.team].color; mctx.lineWidth = 1.5 / k; mctx.setLineDash([4 / k, 4 / k]);
    mctx.beginPath(); mctx.moveTo(g.a.x, g.a.y); mctx.lineTo(g.b.x, g.b.y); mctx.stroke(); mctx.setLineDash([]);
  }
  for (const s of slots) if (s.box) { mctx.fillStyle = '#ffcc33'; mctx.fillRect(s.box.x - 5 / k, s.box.y - 5 / k, 10 / k, 10 / k); }
  const a = toWorld(0, 0), b = toWorld(cw, ch);
  mctx.strokeStyle = 'rgba(255,255,255,.75)'; mctx.lineWidth = 1.2 / k;
  mctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
}

function renderScoreboard(force) {
  const order = TEAMS.map((_, i) => i).sort((a, b) =>
    projectedCash(b) - projectedCash(a) || stats[b].cash - stats[a].cash || stats[b].kills - stats[a].kills || a - b);
  // FLIP: remember where each row was
  const before = new Map();
  for (const [i, el] of sbEls) before.set(i, el.getBoundingClientRect().top);
  order.forEach((i, rank) => {
    let el = sbEls.get(i);
    if (!el) { el = document.createElement('div'); el.className = 'team'; el.style.setProperty('--c', TEAMS[i].color); sbEls.set(i, el); sbRows.append(el); }
    const html = scoreRowHTML(i, rank);
    if (force || el._html !== html) { el.innerHTML = html; el._html = html; }
  });
  const changed = order.some((i, k) => sbOrder[k] !== i);
  if (changed) {
    const prevRank = new Map(sbOrder.map((i, k) => [i, k]));
    order.forEach(i => sbRows.append(sbEls.get(i)));
    order.forEach((i, rank) => {
      const el = sbEls.get(i), old = before.get(i);
      if (old !== undefined) {
        const delta = old - el.getBoundingClientRect().top;
        if (delta) {
          el.style.transition = 'none'; el.style.transform = `translateY(${delta}px)`;
          el.offsetHeight; // reflow
          el.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)'; el.style.transform = '';
        }
      }
      if (prevRank.has(i) && prevRank.get(i) !== rank) {
        const cls = rank < prevRank.get(i) ? 'rank-up' : 'rank-down';
        el.classList.remove('rank-up', 'rank-down'); el.offsetHeight; el.classList.add(cls);
        clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove(cls), 1600);
      }
    });
    sbOrder = order;
  }
}

let TOUR = null;
const INTERMISSION = 12; // seconds before the next match starts automatically
function newTournament() {
  const names = NAME_POOL.slice().sort(() => Math.random() - .5);
  ALL_TEAMS.forEach(t => { t.roster = [names.pop(), names.pop(), names.pop()]; });
  const order = ALL_TEAMS.map(t => t.id).sort(() => Math.random() - .5);
  const ids = Object.keys(MAPS);
  TOUR = {
    maps: [0, 1, 2].map(() => ids[randInt(ids.length)]), // one random map per round
    stages: [
      { label: 'Round 1 · Group A', round: 0, teams: order.slice(0, 4), rules: GROUP_RULES },
      { label: 'Round 1 · Group B', round: 0, teams: order.slice(4), rules: GROUP_RULES },
      { label: 'Round 2', round: 1, teams: null, rules: GROUP_RULES },
      { label: 'Final', round: 2, teams: null, rules: FINAL_RULES },
    ],
    idx: 0, champion: -1, inter: 0,
  };
  startStage(0);
}
function startStage(i) {
  TOUR.idx = i;
  const st = TOUR.stages[i];
  if (i === 2) st.teams = [...TOUR.stages[0].advanced, ...TOUR.stages[1].advanced];
  if (i === 3) st.teams = TOUR.stages[2].advanced.slice();
  TEAMS = st.teams.map(id => ALL_TEAMS[id]);
  RULES = st.rules;
  loadMap(TOUR.maps[st.round]);
  reset();
  buildMinimapStatic();
  $('ccMax').textContent = RULES.target;
  $('stageLbl').textContent = st.label;
  $('stageMap').textContent = MAP.name;
  cam.x = W / 2; cam.y = H / 2; cam.focus = 0; cam.lock = null;
  TOUR.inter = 0;
  $('bracket').classList.remove('show');
  updateHud(true);
}
function tournamentMatchOver(order) {
  const st = TOUR.stages[TOUR.idx];
  st.results = order.map(i => ({ id: TEAMS[i].id, cash: stats[i].cash, cashouts: stats[i].cashouts, kills: stats[i].kills }));
  st.advanced = st.results.slice(0, st.rules.advance).map(r => r.id);
  if (TOUR.idx === 3) {
    TOUR.champion = st.advanced[0];
    addLog(['🏆 ', T(order[0]), ' are the TOURNAMENT CHAMPIONS!'], 'major');
  } else {
    addLog([...st.advanced.map(id => ({ t: ALL_TEAMS[id].name, c: ALL_TEAMS[id].color })).flatMap((x, k) => k ? [' & ', x] : [x]),
      ` advance to ${TOUR.stages[TOUR.idx + 1].label}`], 'major');
  }
  TOUR.inter = TOUR.idx === 3 ? -1 : INTERMISSION;
  showBracket(true);
}

}

  const t = ALL_TEAMS[res.id], done = !!st.advanced, adv = done && st.advanced.includes(res.id);
  const score = st.rules.winCash ? `${res.cashouts} cashout${res.cashouts === 1 ? '' : 's'} · ${money(res.cash)}` : money(res.cash);
  return `<div class="brow${adv ? ' adv' : done ? ' out' : ''}" style="--c:${t.color}"><span class="sw"></span><span class="nm">${t.name}</span>` +
    `<span class="cs">${res.cash !== undefined ? score : ''}</span><span class="ok">${adv ? (TOUR.stages.indexOf(st) === 3 ? '🏆' : '✓') : ''}</span></div>`;

function stageBox(si, title) {

  const status = st.results ? 'Done' : live ? '● Live' : 'Upcoming';

    `<div class="bcol"><h4>Round 2</h4><div class="mapn">${mapName(1)} · top 2 advance</div>${stageBox(2, 'Group')}</div>` +
    `<div class="bcol"><h4>Final</h4><div class="mapn">${mapName(2)} · $25k cashouts · first to $50k</div>${stageBox(3, 'Final')}</div>` +
    `<div class="bcol"><h4>Champion</h4><div class="champ">${champ ? `<div class="cup">🏆</div><div class="cn" style="color:${champ.color}">${champ.name}</div><div class="goal">${champ.roster.join(' · ')}</div>`
      : '<div class="cup" style="opacity:.25">🏆</div><div class="goal">To be decided</div>'}</div></div>`;
  const foot = $('bkFoot');
  if (TOUR.champion >= 0) foot.innerHTML = `<button class="primary" id="bkNext">New tournament</button>`;
  else if (between) foot.innerHTML = `<span class="cd" id="bkCd"></span><button class="primary" id="bkNext">Start ${TOUR.stages[TOUR.idx + 1].label} ▶</button>`;
  else foot.innerHTML = `<button id="bkClose">Close</button>`;
  const nb = $('bkNext'); if (nb) nb.onclick = nextStage;
  const cb = $('bkClose'); if (cb) cb.onclick = () => el.classList.remove('show');
  el.classList.add('show');
}

/* ================= Main loop ================= */
loadMap('canal'); resize(); setSpeed(1); newTournament();
let last = performance.now();
function frame(now) {
  const real = Math.min((now - last) / 1000, .1); last = now;
  if (!paused && !over) {
    const sim = real * speed, n = Math.max(1, Math.ceil(sim / (1 / 60))), h = sim / n;
    for (let i = 0; i < n && !over; i++) step(h);
  }
  updateCamera(real);
  draw(); drawMinimap();
  if (TOUR && over && TOUR.inter > 0 && !paused) { // intermission countdown
    TOUR.inter -= real;
    const cd = $('bkCd'); if (cd) cd.textContent = `Next match in ${Math.ceil(TOUR.inter)}s`;
    if (TOUR.inter <= 0) nextStage();
  }
  hudTimer -= real;
  if (hudTimer <= 0) { hudTimer = .1; updateHud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
