<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Merge 2048</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2c3142; --text: #f1f2f6; --muted: #9aa0b4;
    --accent: #6c5ce7; --accent-hover: #8174f2;
    --board: min(92vw, calc(100vh - 190px), 480px);
    --gap: calc(var(--board) * 0.03);
    --cell: calc((var(--board) - var(--gap) * 5) / 4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1d1a3a, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  .wrap { width: var(--board); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.9rem; }
  h1 { font-size: clamp(1.6rem, 6vw, 2.4rem); font-weight: 900; letter-spacing: -0.5px; }
  h1 span { color: var(--accent-hover); }
  .scores { display: flex; gap: 0.5rem; }
  .score-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.35rem 0.8rem; text-align: center; min-width: 74px; position: relative;
  }
  .score-box small { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
  .score-box b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .plus {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    color: #00b894; font-weight: 800; pointer-events: none;
    animation: rise 0.8s ease-out forwards;
  }
  @keyframes rise { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -34px); } }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.9rem; }
  .bar p { color: var(--muted); font-size: 0.85rem; }
  .btns { display: flex; gap: 0.5rem; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0.55rem 0.95rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--accent-hover); }
  button.ghost { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  button.ghost:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: default; }

  .board {
    position: relative; width: var(--board); height: var(--board);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    touch-action: none;
  }
  .cell {
    position: absolute; width: var(--cell); height: var(--cell);
    background: rgba(255, 255, 255, 0.04); border-radius: 10px;
  }
  .tile {
    position: absolute; left: var(--gap); top: var(--gap);
    width: var(--cell); height: var(--cell);
    transition: transform 110ms ease-in-out; z-index: 2;
  }
  .tile .inner {
    width: 100%; height: 100%; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: calc(var(--cell) * 0.42); color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .tile.new .inner { animation: appear 180ms ease 100ms backwards; }
  .tile.pop .inner { animation: pop 180ms ease; }
  @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .inner[data-len="3"] { font-size: calc(var(--cell) * 0.34); }
  .inner[data-len="4"] { font-size: calc(var(--cell) * 0.27); }
  .inner[data-len="5"] { font-size: calc(var(--cell) * 0.22); }
  .inner[data-v="2"]    { background: #353a52; color: #d6d9e6; }
  .inner[data-v="4"]    { background: #423c6e; color: #e4e0ff; }
  .inner[data-v="8"]    { background: #5b4bd1; }
  .inner[data-v="16"]   { background: #6c5ce7; }
  .inner[data-v="32"]   { background: #8e5cf0; }
  .inner[data-v="64"]   { background: #b05cf0; }
  .inner[data-v="128"]  { background: #d957c8; box-shadow: 0 0 14px rgba(217, 87, 200, 0.45); }
  .inner[data-v="256"]  { background: #f0568a; box-shadow: 0 0 16px rgba(240, 86, 138, 0.5); }
  .inner[data-v="512"]  { background: #ff7a59; box-shadow: 0 0 18px rgba(255, 122, 89, 0.55); }
  .inner[data-v="1024"] { background: #ffb547; color: #2a1d00; box-shadow: 0 0 22px rgba(255, 181, 71, 0.6); }
  .inner[data-v="2048"] { background: #ffd93d; color: #2a1d00; box-shadow: 0 0 28px rgba(255, 217, 61, 0.75); }
  .inner.super          { background: #00b894; box-shadow: 0 0 28px rgba(0, 184, 148, 0.7); }

  .overlay {
    position: absolute; inset: 0; border-radius: 14px; z-index: 10;
    background: rgba(15, 17, 23, 0.82);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0.8rem;
    animation: fade 0.3s ease;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 2.2rem; font-weight: 900; }
  .overlay p { color: var(--muted); }
  .overlay .btns { margin-top: 0.4rem; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .hint { text-align: center; color: #6b7189; font-size: 0.8rem; margin-top: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Merge <span>2048</span></h1>
    <div class="scores">
      <div class="score-box" id="scoreBox"><small>Score</small><b id="score">0</b></div>
      <div class="score-box"><small>Best</small><b id="best">0</b></div>
    </div>
  </div>
  <div class="bar">
    <p>Join the numbers to reach <b>2048</b>!</p>
    <div class="btns">
      <button class="ghost" id="undoBtn" title="Undo last move (U)">↶ Undo</button>
      <button id="newBtn">New Game</button>
    </div>
  </div>
  <div class="board" id="board">
    <div id="tiles"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Game over</h2>
      <p id="ovText"></p>
      <div class="btns" id="ovBtns"></div>
    </div>
  </div>
  <div class="hint">Arrow keys or WASD to slide · swipe on touch screens · U to undo</div>
</div>
<script>
(() => {
  const board = document.getElementById("board");
  const tileLayer = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const scoreBox = document.getElementById("scoreBox");
  const undoBtn = document.getElementById("undoBtn");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const ovBtns = document.getElementById("ovBtns");

  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // Background cells
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.left = `calc(var(--gap) + ${c} * (var(--cell) + var(--gap)))`;
    cell.style.top = `calc(var(--gap) + ${r} * (var(--cell) + var(--gap)))`;
    board.insertBefore(cell, tileLayer);
  }

  let tiles = [], nextId = 1, score = 0, best = load("merge2048.best", 0);
  let won = false, keepGoing = false, over = false, history = null;
  const els = new Map();

  function grid() {
    const g = [[], [], [], []];
    for (const t of tiles) g[t.r][t.c] = t;
    return g;
  }

  function spawn() {
    const g = grid(), empty = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!g[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    tiles.push({ id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c });
  }

  function setInner(inner, v) {
    inner.textContent = v;
    inner.dataset.v = v;
    inner.dataset.len = String(v).length;
    inner.classList.toggle("super", v > 2048);
  }

  function place(el, t) {
    el.style.transform = `translate(calc(${t.c} * (var(--cell) + var(--gap))), calc(${t.r} * (var(--cell) + var(--gap))))`;
  }

  function makeEl(t, animate) {
    const el = document.createElement("div");
    el.className = "tile" + (animate ? " new" : "");
    const inner = document.createElement("div");
    inner.className = "inner";
    el.appendChild(inner);
    setInner(inner, t.v);
    place(el, t);
    tileLayer.appendChild(el);
    els.set(t.id, el);
    return el;
  }

  function render(removed = []) {
    for (const t of tiles) {
      let el = els.get(t.id);
      if (!el) { makeEl(t, true); continue; }
      place(el, t);
      if (t.merged) {
        t.merged = false;
        const inner = el.firstChild;
        setTimeout(() => {
          setInner(inner, t.v);
          el.classList.remove("pop", "new");
          void el.offsetWidth;
          el.classList.add("pop");
        }, 110);
      }
    }
    for (const t of removed) {
      const el = els.get(t.id);
      if (!el) continue;
      els.delete(t.id);
      el.style.zIndex = 1;
      place(el, t);
      setTimeout(() => el.remove(), 120);
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
    undoBtn.disabled = !history;
  }

  function rebuild() {
    tileLayer.innerHTML = "";
    els.clear();
    for (const t of tiles) makeEl(t, false);
    render();
  }

  function canMove() {
    if (tiles.length < 16) return true;
    const g = grid();
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const v = g[r][c].v;
      if ((c < 3 && g[r][c + 1].v === v) || (r < 3 && g[r + 1][c].v === v)) return true;
    }
    return false;
  }

  function showOverlay(title, textStr, buttons) {
    ovTitle.textContent = title;
    ovText.textContent = textStr;
    ovBtns.innerHTML = "";
    for (const [label, fn, ghost] of buttons) {
      const b = document.createElement("button");
      b.textContent = label;
      if (ghost) b.className = "ghost";
      b.addEventListener("click", fn);
      ovBtns.appendChild(b);
    }
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function move(dir) {
    if (over || (won && !keepGoing)) return;
    const snapshot = { tiles: tiles.map(t => ({ ...t, merged: false })), score, nextId };
    const g = grid();
    const removed = [];
    let moved = false, gained = 0;

    for (let i = 0; i < 4; i++) {
      const coords = [];
      for (let j = 0; j < 4; j++) {
        if (dir === "L") coords.push([i, j]);
        if (dir === "R") coords.push([i, 3 - j]);
        if (dir === "U") coords.push([j, i]);
        if (dir === "D") coords.push([3 - j, i]);
      }
      const line = coords.map(([r, c]) => g[r][c]).filter(Boolean);
      let slot = 0, last = null;
      for (const t of line) {
        if (last && last.v === t.v && !last.merged) {
          const [r, c] = coords[slot - 1];
          t.r = r; t.c = c;
          removed.push(t);
          last.v *= 2; last.merged = true;
          gained += last.v; moved = true;
        } else {
          const [r, c] = coords[slot];
          if (t.r !== r || t.c !== c) moved = true;
          t.r = r; t.c = c;
          last = t; slot++;
        }
      }
    }
    if (!moved) return;

    history = snapshot;
    tiles = tiles.filter(t => !removed.includes(t));
    score += gained;
    if (score > best) { best = score; save("merge2048.best", best); }
    if (gained) {
      const p = document.createElement("div");
      p.className = "plus";
      p.textContent = "+" + gained;
      scoreBox.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
    spawn();
    render(removed);
    saveGame();

    if (!won && tiles.some(t => t.v >= 2048)) {
      won = true;
      setTimeout(() => showOverlay("You made 2048!", `Score ${score}`, [
        ["Keep going", () => { keepGoing = true; hideOverlay(); saveGame(); }],
        ["New game", newGame, true]
      ]), 350);
    } else if (!canMove()) {
      over = true;
      setTimeout(() => showOverlay("No moves left", `Final score ${score}`, [
        ["Undo", undo, true],
        ["Try again", newGame]
      ]), 350);
    }
  }

  function undo() {
    if (!history) return;
    tiles = history.tiles; score = history.score; nextId = history.nextId;
    history = null; over = false;
    if (!tiles.some(t => t.v >= 2048)) { won = false; keepGoing = false; }
    hideOverlay();
    rebuild();
    saveGame();
  }

  function newGame() {
    tiles = []; score = 0; won = false; keepGoing = false; over = false; history = null;
    hideOverlay();
    spawn(); spawn();
    rebuild();
    saveGame();
  }

  function saveGame() {
    save("merge2048.game", { tiles: tiles.map(({ v, r, c }) => ({ v, r, c })), score, won, keepGoing });
  }

  function restore() {
    const s = load("merge2048.game", null);
    if (!s || !Array.isArray(s.tiles) || !s.tiles.length) return false;
    tiles = s.tiles.map(t => ({ id: nextId++, v: t.v, r: t.r, c: t.c }));
    score = s.score || 0; won = !!s.won; keepGoing = won;
    rebuild();
    if (!canMove()) {
      over = true;
      showOverlay("No moves left", `Final score ${score}`, [["Try again", newGame]]);
    }
    return true;
  }

  const KEYMAP = {
    ArrowLeft: "L", ArrowRight: "R", ArrowUp: "U", ArrowDown: "D",
    KeyA: "L", KeyD: "R", KeyW: "U", KeyS: "D"
  };
  addEventListener("keydown", e => {
    if (KEYMAP[e.code]) { e.preventDefault(); move(KEYMAP[e.code]); }
    else if (e.code === "KeyU" || ((e.ctrlKey || e.metaKey) && e.code === "KeyZ")) { e.preventDefault(); undo(); }
  });

  let start = null;
  board.addEventListener("pointerdown", e => { start = { x: e.clientX, y: e.clientY }; });
  addEventListener("pointerup", e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "R" : "L");
    else move(dy > 0 ? "D" : "U");
  });

  document.getElementById("newBtn").addEventListener("click", e => { e.currentTarget.blur(); newGame(); });
  undoBtn.addEventListener("click", e => { e.currentTarget.blur(); undo(); });

  if (!restore()) newGame();
  window.focus();
})();
</script>
</body>
</html>
