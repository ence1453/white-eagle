<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eagle Flight</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0f1117;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");

  // Virtual world is 600 units tall; width follows the window's aspect ratio.
  const VH = 600, GROUND = 70, SPACING = 290, PILLAR_W = 76;
  let VW = 800, scale = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.floor(innerWidth * dpr));
    cv.height = Math.max(1, Math.floor(innerHeight * dpr));
    scale = cv.height / VH;
    VW = cv.width / scale;
  }
  addEventListener("resize", resize);
  resize();

  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  let best = load("eagleFlight.best", 0);
  let state = "ready";            // ready | play | over
  let score = 0, t = 0, overAt = 0, shake = 0, flash = 0, newBest = false;
  let dist = 0;                   // total distance scrolled, drives parallax
  const bird = { x: 140, y: VH / 2, vy: 0, r: 14, wing: 0 };
  let pillars = [], feathers = [], parts = [];

  const stars = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random() * 0.6, s: Math.random() * 1.6 + 0.4, tw: Math.random() * 6 }));
  const clouds = Array.from({ length: 7 }, () => ({ x: Math.random() * 1800, y: 40 + Math.random() * 240, s: 0.6 + Math.random() * 0.9 }));
  const ridge = (seed) => Array.from({ length: 48 }, (_, i) => Math.sin(i * 1.7 + seed) * 0.5 + Math.sin(i * 0.63 + seed * 2) * 0.5);
  const far = ridge(1), near = ridge(4);

  const speed = () => Math.min(185 + score * 5, 340);
  const gapSize = () => Math.max(190 - score * 2.4, 128);

  function reset() {
    score = 0; dist = 0; pillars = []; feathers = []; parts = [];
    bird.y = VH / 2; bird.vy = 0; newBest = false;
  }

  function spawnPillar() {
    const g = gapSize();
    const minTop = 50, maxTop = VH - GROUND - 50 - g;
    const top = minTop + Math.random() * (maxTop - minTop);
    pillars.push({ x: VW + 40, top, gap: g, passed: false });
    // Sometimes leave a golden feather halfway to the next pillar.
    if (score > 1 && Math.random() < 0.35) {
      feathers.push({ x: VW + 40 + PILLAR_W + (SPACING - PILLAR_W) / 2, y: 90 + Math.random() * (VH - GROUND - 180), got: false, bob: Math.random() * 6 });
    }
  }

  function flap() {
    if (state === "ready") { reset(); state = "play"; }
    if (state === "over") {
      if (t - overAt < 0.6) return;
      reset(); state = "ready"; return;
    }
    bird.vy = -440;
    for (let i = 0; i < 4; i++) {
      parts.push({ x: bird.x - 10, y: bird.y + 6, vx: -60 - Math.random() * 80, vy: 40 + Math.random() * 80, life: 0.5, max: 0.5, col: "#c8a27a", size: 3 });
    }
  }

  function die() {
    state = "over"; overAt = t; shake = 14; flash = 1;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 240;
      parts.push({ x: bird.x, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.9, max: 0.9, col: i % 3 ? "#7a5432" : "#f5f5f5", size: 3 + Math.random() * 3 });
    }
    if (score > best) { best = score; newBest = true; save("eagleFlight.best", best); }
  }

  function circleRect(cx, cy, r, x, y, w, h) {
    const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
  }

  function update(dt) {
    t += dt;
    bird.x = Math.max(110, VW * 0.28);
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 3);

    if (state === "ready") {
      dist += 110 * dt;
      bird.y = VH / 2 + Math.sin(t * 3) * 12;
      bird.wing += dt * 12;
    } else if (state === "play") {
      const sp = speed();
      dist += sp * dt;
      bird.vy = Math.min(bird.vy + 1450 * dt, 720);
      bird.y += bird.vy * dt;
      bird.wing += dt * (bird.vy < 0 ? 26 : 9);
      if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

      for (const p of pillars) p.x -= sp * dt;
      for (const f of feathers) f.x -= sp * dt;
      pillars = pillars.filter(p => p.x + PILLAR_W > -20);
      feathers = feathers.filter(f => f.x > -30 && !f.got);
      const last = pillars[pillars.length - 1];
      if (!last || last.x < VW + 40 - SPACING) spawnPillar();

      const hitR = bird.r - 3;
      for (const p of pillars) {
        if (circleRect(bird.x, bird.y, hitR, p.x, 0, PILLAR_W, p.top) ||
            circleRect(bird.x, bird.y, hitR, p.x, p.top + p.gap, PILLAR_W, VH)) { die(); break; }
        if (!p.passed && p.x + PILLAR_W < bird.x) {
          p.passed = true; score++;
        }
      }
      for (const f of feathers) {
        if (!f.got && Math.hypot(f.x - bird.x, f.y - bird.y) < bird.r + 14) {
          f.got = true; score += 2;
          parts.push({ x: f.x, y: f.y, vx: 0, vy: -60, life: 0.9, max: 0.9, text: "+2", col: "#ffd93d" });
          for (let i = 0; i < 10; i++) {
            const a = Math.random() * Math.PI * 2;
            parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.5, max: 0.5, col: "#ffd93d", size: 2.5 });
          }
        }
      }
      if (state === "play" && bird.y + bird.r > VH - GROUND) { bird.y = VH - GROUND - bird.r; die(); }
    } else {
      // Tumble to the ground after a crash.
      if (bird.y + bird.r < VH - GROUND) {
        bird.vy = Math.min(bird.vy + 1600 * dt, 800);
        bird.y = Math.min(bird.y + bird.vy * dt, VH - GROUND - bird.r);
      }
    }

    for (const p of parts) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (!p.text) p.vy += 500 * dt;
    }
    parts = parts.filter(p => p.life > 0);
  }

  // ---------- Drawing ----------
  function drawRange(h, off, base, amp, seg, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, VH);
    const s = Math.floor(off / seg), fr = off % seg;
    for (let k = 0; k <= Math.ceil(VW / seg) + 1; k++) {
      const v = h[(s + k) % h.length];
      ctx.lineTo(k * seg - fr, base - amp * (v * 0.5 + 0.5));
    }
    ctx.lineTo(VW + seg, VH);
    ctx.closePath();
    ctx.fill();
  }

  function drawPillar(x, y, h, capAtBottom) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + PILLAR_W, 0);
    g.addColorStop(0, "#2b2f4c"); g.addColorStop(0.35, "#4c5180"); g.addColorStop(1, "#21243a");
    ctx.fillStyle = g;
    ctx.fillRect(x, y, PILLAR_W, h);
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let yy = y + 30; yy < y + h; yy += 46) ctx.fillRect(x + 8, yy, PILLAR_W - 16, 3);
    const capY = capAtBottom ? y + h - 20 : y;
    ctx.fillStyle = "#5d6296";
    ctx.fillRect(x - 7, capY, PILLAR_W + 14, 20);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(x - 7, capY, PILLAR_W + 14, 4);
  }

  function drawFeather(f) {
    ctx.save();
    ctx.translate(f.x, f.y + Math.sin(t * 4 + f.bob) * 6);
    ctx.rotate(-0.6);
    ctx.shadowColor = "#ffd93d"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#ffd93d";
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#b8860b"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 20); ctx.stroke();
    ctx.restore();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    const rot = state === "ready" ? 0 : Math.max(-0.5, Math.min(1.3, bird.vy / 550));
    ctx.rotate(rot);
    ctx.fillStyle = "#5e3f22";
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-29, -9); ctx.lineTo(-27, 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7a5432";
    ctx.beginPath(); ctx.ellipse(0, 2, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath(); ctx.arc(11, -6, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f9c74f";
    ctx.beginPath(); ctx.moveTo(18, -9); ctx.lineTo(28, -4); ctx.lineTo(18, -1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(14, -8, state === "over" ? 0.8 : 1.9, 0, Math.PI * 2); ctx.fill();
    const wa = Math.sin(bird.wing) * 0.9;
    ctx.save();
    ctx.translate(-3, -1);
    ctx.rotate(-wa);
    ctx.fillStyle = "#4b311a";
    ctx.beginPath(); ctx.ellipse(-3, -9, 16, 6, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function text(str, x, y, size, col, align = "center", weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = col;
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const sx = (Math.random() - 0.5) * shake * scale, sy = (Math.random() - 0.5) * shake * scale;
    ctx.setTransform(scale, 0, 0, scale, sx, sy);

    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, "#141833"); sky.addColorStop(0.6, "#33296b"); sky.addColorStop(1, "#7b4a8f");
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, VW + 40, VH + 40);

    for (const s of stars) {
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + s.tw));
      ctx.fillStyle = "#fff";
      ctx.fillRect(s.x * VW, s.y * VH, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#fdf6e3";
    ctx.shadowColor = "#fdf6e3"; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(VW * 0.8, 95, 34, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    drawRange(far, dist * 0.12, VH - GROUND - 40, 170, 90, "#2a2352");
    for (const c of clouds) {
      const x = ((c.x - dist * 0.22 * c.s) % (VW + 300) + VW + 300) % (VW + 300) - 150;
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.beginPath();
      ctx.ellipse(x, c.y, 60 * c.s, 18 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 35 * c.s, c.y - 10 * c.s, 40 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    drawRange(near, dist * 0.35, VH - GROUND + 10, 120, 70, "#1d1838");

    for (const p of pillars) {
      drawPillar(p.x, 0, p.top, true);
      drawPillar(p.x, p.top + p.gap, VH - GROUND - (p.top + p.gap), false);
    }
    for (const f of feathers) if (!f.got) drawFeather(f);

    ctx.fillStyle = "#1a1530";
    ctx.fillRect(-20, VH - GROUND, VW + 40, GROUND + 20);
    ctx.fillStyle = "#6c5ce7";
    ctx.fillRect(-20, VH - GROUND, VW + 40, 4);
    ctx.fillStyle = "rgba(108,92,231,0.25)";
    const off = dist % 40;
    for (let x = -off; x < VW + 40; x += 40) ctx.fillRect(x, VH - GROUND + 14, 20, 4);

    drawBird();

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      if (p.text) text(p.text, p.x, p.y, 22, p.col);
      else { ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    }
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
      ctx.fillRect(-20, -20, VW + 40, VH + 40);
    }

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (state === "play") {
      text(String(score), VW / 2, 70, 60, "#fff");
    } else if (state === "ready") {
      text("Eagle Flight", VW / 2, 150, 54, "#fff");
      text("Click, tap or press Space to flap", VW / 2, 205, 20, "#d6d1ff", "center", 600);
      text("Fly between the pillars · grab gold feathers for +2", VW / 2, 235, 16, "#9aa0b4", "center", 500);
      if (best > 0) text(`Best: ${best}`, VW / 2, VH - GROUND - 40, 20, "#ffd93d", "center", 700);
    } else {
      const w = 300, h = 210, x = VW / 2 - w / 2, y = 120;
      ctx.fillStyle = "rgba(26,29,39,0.92)";
      ctx.strokeStyle = "#6c5ce7"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 14) : ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
      text("Crashed!", VW / 2, y + 38, 34, "#ff7675");
      text(`Score  ${score}`, VW / 2, y + 88, 26, "#fff", "center", 700);
      text(newBest ? "New best!" : `Best  ${best}`, VW / 2, y + 124, 20, newBest ? "#00b894" : "#ffd93d", "center", 700);
      if (t - overAt > 0.6) text("Click or press Space to continue", VW / 2, y + 172, 16, "#9aa0b4", "center", 500);
    }
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000, 1 / 30);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); if (!e.repeat) flap(); }
  });
  cv.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
  window.focus();
})();
</script>
</body>
</html>
