<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CONQUEST 50v50 — Spectator</title>
<style>
html,body{margin:0;height:100%;background:#0b0f0a;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
/* =====================================================================
   CONQUEST 50v50 — spectator battle sim. Single file, Canvas2D only.
   ===================================================================== */
var W=2400,H=1600,TAU=Math.PI*2;
var cv=document.getElementById('c');
var ctx=cv.getContext('2d',{alpha:false});

/* ---------- utils ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
var hyp=Math.hypot;
function angDiff(a,b){var d=(b-a)%TAU;if(d>Math.PI)d-=TAU;else if(d<-Math.PI)d+=TAU;return d;}
function turnTo(a,b,r){var d=angDiff(a,b);return Math.abs(d)<=r?b:a+(d>0?r:-r);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var RNG=mulberry(7771);
function rr(a,b){return a+RNG()*(b-a);}

/* ---------- teams / world ---------- */
var TEAMS=[
 {name:'BLUE',col:'#3d8bff',dark:'#22519f',light:'#a9ccff',bx:150,by:600,dir:1},
 {name:'RED', col:'#ff503c',dark:'#9e2a1d',light:'#ffb3a8',bx:2250,by:1000,dir:-1}];
var RW=100,BR=[200,640,1300];
var PONDS=[{x:210,y:170,r:70},{x:1650,y:1470,r:95},{x:700,y:1480,r:55}];
function cxr(y){return 1200+100*Math.sin(y/230);}
function isWater(x,y){
  if(Math.abs(x-cxr(y))<RW/2){var br=false;for(var i=0;i<3;i++)if(Math.abs(y-BR[i])<34){br=true;break;}if(!br)return true;}
  for(var j=0;j<PONDS.length;j++){var p=PONDS[j],dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<p.r*p.r)return true;}
  return false;
}
/* asymmetric layout: BLUE holds open farmland + refinery on the west, RED holds hill, village and outpost on the east */
var FLAGDEF=[['A',760,300,0],['B',800,1250,0],['C',cxr(640),640,0],['D',1750,330,0],['E',1620,1230,0],['F',880,900,0],['G',1700,720,0]];
var ROADS=[];
function road(w,paved,pts){ROADS.push({w:w,paved:paved,pts:pts});}
road(15,1,[[150,600],[450,700],[700,800],[880,900]]);
road(15,1,[[880,900],[1020,800],[1130,710],[cxr(640),640]]);
road(15,1,[[cxr(640),640],[1450,660],[1700,720]]);
road(15,1,[[1700,720],[1950,820],[2250,1000]]);
road(10,0,[[1700,720],[1720,520],[1750,330]]);
road(10,0,[[2250,1000],[1950,1130],[1620,1230]]);
road(10,0,[[1620,1230],[1450,1300],[cxr(1300),1300],[1000,1290],[800,1250]]);
road(10,0,[[150,600],[400,480],[760,300]]);
road(10,0,[[150,600],[300,900],[550,1150],[800,1250]]);
road(10,0,[[880,900],[820,1070],[800,1250]]);
road(10,0,[[760,300],[1000,230],[cxr(200),200],[1500,230],[1750,330]]);
road(10,0,[[760,300],[800,600],[880,900]]);
function roadDist(x,y){
  var best=1e9;
  for(var i=0;i<ROADS.length;i++){var r=ROADS[i],p=r.pts;
    for(var j=0;j<p.length-1;j++){
      var ax=p[j][0],ay=p[j][1],bx=p[j+1][0],by=p[j+1][1],dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
      var t=l2>0?clamp(((x-ax)*dx+(y-ay)*dy)/l2,0,1):0;
      var d=hyp(x-ax-dx*t,y-ay-dy*t)-r.w/2;if(d<best)best=d;}}
  return best;
}

/* ---------- obstacles ---------- */
var obs=[],aas=[];
function addC(k,x,y,r,z,low,col,col2){var o={s:0,k:k,x:x,y:y,r:r,hw:r,hh:r,z:z,low:!!low,col:col,col2:col2,st:0,dyn:!low};obs.push(o);return o;}
function addR(k,x,y,hw,hh,z,low,col,col2){var o={s:1,k:k,x:x,y:y,r:Math.max(hw,hh),hw:hw,hh:hh,z:z,low:!!low,col:col,col2:col2,st:0,dyn:!low};obs.push(o);return o;}
var RUNWAYS=[{x0:10,y0:900,x1:370,y1:950},{x0:W-370,y0:1335,x1:W-10,y1:1385}];
function inRunway(x,y,r){for(var i=0;i<2;i++){var q=RUNWAYS[i];if(x>q.x0-r&&x<q.x1+r&&y>q.y0-r&&y<q.y1+r)return true;}return false;}
function spotOK(x,y,r,gap){
  if(x<r+12||y<r+12||x>W-r-12||y>H-r-12)return false;
  if(isWater(x,y)||isWater(x+r,y)||isWater(x-r,y)||isWater(x,y+r)||isWater(x,y-r))return false;
  var i;
  for(i=0;i<FLAGDEF.length;i++)if(hyp(FLAGDEF[i][1]-x,FLAGDEF[i][2]-y)<62+r)return false;
  for(i=0;i<2;i++)if(hyp(TEAMS[i].bx-x,TEAMS[i].by-y)<150+r)return false;
  if(inRunway(x,y,r+6))return false;
  if(roadDist(x,y)<r+9)return false;
  for(i=0;i<obs.length;i++){var o=obs[i];
    if(o.s===0){if(hyp(o.x-x,o.y-y)<o.r+r+gap)return false;}
    else{var px=clamp(x,o.x-o.hw,o.x+o.hw),py=clamp(y,o.y-o.hh,o.y+o.hh);if(hyp(px-x,py-y)<r+gap)return false;}}
  return true;
}
var WALLC=['#c9b79c','#b8a58a','#d3c4a8','#a89880','#c4b6a0'],ROOFC=['#8a3b2f','#6f5a4a','#5b6b73','#7a4a3a','#4d5f4a','#7d6a52'];
function pick(a){return a[(RNG()*a.length)|0];}
function tryBld(x0,y0,x1,y1,n,hwa,hwb,hha,hhb,za,zb,gap){
  var c=0,t=0;
  while(c<n&&t<n*30){t++;var x=rr(x0,x1),y=rr(y0,y1),hw=rr(hwa,hwb),hh=rr(hha,hhb);
    if(spotOK(x,y,Math.max(hw,hh)*1.05,gap)){addR('bld',x,y,hw,hh,rr(za,zb),false,pick(WALLC),pick(ROOFC));c++;}}
}
function tryTrees(n,cx,cy,r0,r1,gap){
  var c=0,t=0;
  while(c<n&&t<n*20){t++;var a=rr(0,TAU),d=rr(r0,r1),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,r=rr(6,9.5);
    if(spotOK(x,y,r,gap)){addC('tree',x,y,r,rr(22,34),false,pick(['#2f5a2a','#3a6b32','#2b5226','#427a37']),null);c++;}}
}
function tryRocks(n,cx,cy,r0,r1){
  var c=0,t=0;
  while(c<n&&t<n*20){t++;var a=rr(0,TAU),d=rr(r0,r1),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,r=rr(7,15);
    if(spotOK(x,y,r,3)){addC('rock',x,y,r,6,true,pick(['#8b8b86','#7c7c78','#9a9a94']),null);c++;}}
}
function ring(x,y,rad,skip){
  for(var k=0;k<8;k++){if(k%3===skip%3)continue;
    var a=k*TAU/8+0.39,px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;
    if(isWater(px,py)||isWater(px,py+14)||isWater(px,py-14))continue;
    var hor=Math.abs(Math.sin(a))>0.7;
    addR('bag',px,py,hor?13:3.5,hor?3.5:13,5,true,'#c2a96b','#8f7a45');}
}
function genMap(){
  RNG=mulberry(7771);obs.length=0;aas.length=0;
  var t,i,d,bx,by;
  for(t=0;t<2;t++){d=TEAMS[t].dir;bx=TEAMS[t].bx;by=TEAMS[t].by;
    addR('bld',bx-60*d,by-200,34,20,26,false,'#8d9097','#5b6068');
    addR('bld',bx-60*d,by+200,34,20,26,false,'#8d9097','#5b6068');
    addR('bld',bx-112*d,by,14,38,22,false,'#9a8f7a','#6d6554');
    addC('tank',bx+10*d,by-150,16,30,false,'#9aa2a8',null);
    addC('tank',bx+10*d,by+150,16,30,false,'#9aa2a8',null);
    addR('tower',bx+40*d,by-250,5,5,64,false,'#6b6b66','#3b3b38');
    aas.push({team:t,x:bx+110*d,y:by-135,ang:t?Math.PI:0,cd:0,scan:0,tgt:null,flash:0});
    aas.push({team:t,x:bx+110*d,y:by+135,ang:t?Math.PI:0,cd:0,scan:0,tgt:null,flash:0});
    for(i=0;i<5;i++){addR('bag',bx+170*d,by-100+i*50,3.5,13,5,true,'#c2a96b','#8f7a45');}
  }
  // flag sandbag rings
  for(i=0;i<FLAGDEF.length;i++)ring(FLAGDEF[i][1],FLAGDEF[i][2],54,i);
  var FA=FLAGDEF[0],FB=FLAGDEF[1],FC=FLAGDEF[2],FD=FLAGDEF[3],FE=FLAGDEF[4],FF=FLAGDEF[5],FG=FLAGDEF[6];
  var ax=FA[1],ay=FA[2],bxq=FB[1],byq=FB[2],cx0=FC[1],cy0=FC[2],dx0=FD[1],dy0=FD[2],ex0=FE[1],ey0=FE[2],fx0=FF[1],fy0=FF[2],gx0=FG[1],gy0=FG[2];
  // BLUE base: open walls line; RED base: forest belt + bunkers
  for(i=0;i<5;i++)addR('wall',TEAMS[0].bx+240,TEAMS[0].by-170+i*85,4,28,9,true,'#9c9a93',null);
  addR('bld',TEAMS[1].bx-80,TEAMS[1].by-90,18,12,16,false,'#6e7365','#464b3f');addR('bld',TEAMS[1].bx-80,TEAMS[1].by+90,18,12,16,false,'#6e7365','#464b3f');
  tryTrees(45,TEAMS[1].bx-330,TEAMS[1].by,0,170,6);
  // A: open farmland (long sight lines, little cover)
  addR('bld',ax-90,ay-35,36,22,28,false,'#9c4a3a','#6a2f26');addR('bld',ax+110,ay-75,16,14,22,false,'#d3c4a8','#8a3b2f');
  addR('bld',ax-165,ay+70,15,13,20,false,'#d3c4a8','#7a4a3a');addC('tank',ax-40,ay-65,11,34,false,'#c9c9c0',null);
  for(i=0;i<9;i++)addC('rock',rr(ax+30,ax+200),rr(ay+40,ay+130),9,6,true,'#c4b36a',null);
  tryTrees(8,ax,ay,160,300,10);
  // B: quarry + dense forest (close combat)
  tryRocks(16,bxq,byq,70,135);
  addR('cont',bxq-70,byq-60,17,7,14,false,'#9a4b2f','#6a3320');addR('cont',bxq+70,byq+60,17,7,14,false,'#2f5f8a','#1f405e');addR('cont',bxq+90,byq-70,7,17,14,false,'#6a7a2f','#44501f');
  tryTrees(120,bxq,byq,175,330,4);
  // C: dense bridge town
  tryBld(cx0-175,cy0-175,cx0+175,cy0+175,22,12,26,10,20,22,34,28);
  // F: refinery
  addC('tank',fx0-70,fy0-80,31,46,false,'#b5b9bd',null);addC('tank',fx0+80,fy0-75,31,46,false,'#b5b9bd',null);
  addC('tank',fx0-75,fy0+85,31,46,false,'#b5b9bd',null);addC('tank',fx0+85,fy0+80,31,46,false,'#b5b9bd',null);
  addC('tank',fx0,fy0-115,24,40,false,'#c4c7ca',null);
  addR('cont',fx0-130,fy0,7,17,14,false,'#a8472f','#702f20');addR('cont',fx0+135,fy0,7,17,14,false,'#3d6a8f','#274660');
  addR('wall',fx0,fy0+135,40,4,9,true,'#9c9a93',null);addR('wall',fx0,fy0-140,40,4,9,true,'#9c9a93',null);
  // G: radio hill (open, long range) + rock ridge flank
  addR('tower',gx0-20,gy0-60,6,6,78,false,'#7a7a74','#44443f');
  tryRocks(20,gx0,gy0,70,180);tryTrees(10,gx0,gy0,170,250,10);
  addR('bld',gx0+70,gy0+60,18,12,16,false,'#6e7365','#464b3f');
  for(i=0;i<16;i++)addC('rock',560+i*26,520+Math.sin(i)*14,rr(10,14),6,true,pick(['#8b8b86','#7c7c78','#9a9a94']),null);
  for(i=0;i<5;i++)addR('wall',1740+i*80,820+(i%2)*14,26,4,9,true,'#9c9a93',null);
  // D: village
  tryBld(dx0-110,dy0-110,dx0+120,dy0+110,9,12,22,10,18,22,32,14);addR('bld',dx0+90,dy0-50,24,16,40,false,'#d9d0bc','#7a4a3a');
  tryTrees(24,dx0,dy0,140,260,10);
  // E: outpost, towers + lake behind
  addR('bld',ex0-60,ey0-30,16,10,18,false,'#6e7365','#464b3f');addR('bld',ex0+70,ey0+100,16,10,18,false,'#6e7365','#464b3f');
  addR('bld',ex0+70,ey0-30,12,12,16,false,'#6e7365','#464b3f');addR('bld',ex0-70,ey0+90,12,12,16,false,'#6e7365','#464b3f');
  addR('tower',ex0-10,ey0-90,5,5,66,false,'#6b6b66','#3b3b38');
  tryTrees(55,ex0,ey0,170,320,4);
  // random scatter: tree clumps
  for(i=0;i<26;i++){var cx=rr(120,W-120),cy=rr(100,H-100);tryTrees(rr(6,12)|0,cx,cy,5,48,2);}
  // rocks, ruined walls, crates
  for(i=0;i<34;i++){tryRocks(1+((RNG()*3)|0),rr(100,W-100),rr(100,H-100),0,30);}
  var c=0,tt=0;
  while(c<30&&tt<800){tt++;var x=rr(120,W-120),y=rr(100,H-100),hor=RNG()<.5,hw=hor?rr(16,32):4,hh=hor?4:rr(16,32);
    if(spotOK(x,y,Math.max(hw,hh)*1.1,6)){addR('wall',x,y,hw,hh,9,true,'#9c9a93',null);c++;}}
  c=0;tt=0;
  while(c<14&&tt<500){tt++;var x2=rr(120,W-120),y2=rr(100,H-100);
    if(spotOK(x2,y2,10,4)){addR('cont',x2,y2,RNG()<.5?17:7,RNG()<.5?7:17,14,false,pick(['#9a4b2f','#2f5f8a','#6a7a2f','#8a7a2f']),'#333');c++;}}
  regObs();
}

/* ---------- spatial grids ---------- */
var OC=64,OCX=Math.ceil(W/OC),OCY=Math.ceil(H/OC),ogrid=[];
function regObs(){
  ogrid=[];for(var i=0;i<OCX*OCY;i++)ogrid.push([]);
  for(var k=0;k<obs.length;k++){var o=obs[k];
    var x0=clamp(((o.x-o.hw)/OC)|0,0,OCX-1),x1=clamp(((o.x+o.hw)/OC)|0,0,OCX-1),y0=clamp(((o.y-o.hh)/OC)|0,0,OCY-1),y1=clamp(((o.y+o.hh)/OC)|0,0,OCY-1);
    for(var cy=y0;cy<=y1;cy++)for(var cx=x0;cx<=x1;cx++)ogrid[cy*OCX+cx].push(o);}
}
function hitObs(o,x,y,rad){
  if(o.s===0){var oc=o.r;if(o.k==='tree'){if(rad>=9)return false;oc=o.r*.35;}else if(rad>=12&&o.low)return false;var dx=x-o.x,dy=y-o.y,rs2=oc+rad;return dx*dx+dy*dy<rs2*rs2;}
  if(rad>=9&&o.low&&(o.k==='bag'||o.k==='wall'))return false;
  var px=clamp(x,o.x-o.hw,o.x+o.hw),py=clamp(y,o.y-o.hh,o.y+o.hh),ex=x-px,ey=y-py;return ex*ex+ey*ey<rad*rad;
}
function blocked(x,y,rad){
  if(x<rad||y<rad||x>W-rad||y>H-rad)return true;
  if(isWater(x,y))return true;
  if(rad>6&&(isWater(x+rad,y)||isWater(x-rad,y)||isWater(x,y+rad)||isWater(x,y-rad)))return true;
  var x0=clamp(((x-rad)/OC)|0,0,OCX-1),x1=clamp(((x+rad)/OC)|0,0,OCX-1),y0=clamp(((y-rad)/OC)|0,0,OCY-1),y1=clamp(((y+rad)/OC)|0,0,OCY-1);
  for(var cy=y0;cy<=y1;cy++)for(var cx=x0;cx<=x1;cx++){var c=ogrid[cy*OCX+cx];for(var i=0;i<c.length;i++)if(hitObs(c[i],x,y,rad))return true;}
  return false;
}
function segCirc(x1,y1,x2,y2,cx,cy,r){
  var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy,t=l2>0?((cx-x1)*dx+(cy-y1)*dy)/l2:0;t=t<0?0:t>1?1:t;
  var px=x1+dx*t-cx,py=y1+dy*t-cy;return px*px+py*py<r*r;
}
function segRect(x1,y1,x2,y2,o){
  var t0=0,t1=1,dx=x2-x1,dy=y2-y1;
  var p=[-dx,dx,-dy,dy],q=[x1-(o.x-o.hw),(o.x+o.hw)-x1,y1-(o.y-o.hh),(o.y+o.hh)-y1];
  for(var i=0;i<4;i++){
    if(p[i]===0){if(q[i]<0)return false;}
    else{var r=q[i]/p[i];if(p[i]<0){if(r>t1)return false;if(r>t0)t0=r;}else{if(r<t0)return false;if(r<t1)t1=r;}}}
  return true;
}
var STAMP=1;
function nearObs(o,x,y,d){
  if(o.s===0)return hyp(x-o.x,y-o.y)<o.r+d;
  var px=clamp(x,o.x-o.hw,o.x+o.hw),py=clamp(y,o.y-o.hh,o.y+o.hh);return hyp(x-px,y-py)<d;
}
function rayBlock(x1,y1,x2,y2,shot){
  var dx=x2-x1,dy=y2-y1,L=Math.sqrt(dx*dx+dy*dy),n=Math.max(1,Math.ceil(L/(OC*0.4)));STAMP++;
  for(var i=0;i<=n;i++){
    var t=i/n,px=x1+dx*t,py=y1+dy*t,cx=(px/OC)|0,cy=(py/OC)|0;
    if(cx<0||cy<0||cx>=OCX||cy>=OCY)continue;
    var c=ogrid[cy*OCX+cx];
    for(var j=0;j<c.length;j++){
      var o=c[j];if(o.st===STAMP)continue;o.st=STAMP;
      if(o.k==='tree'){if(!shot)continue;if(segCirc(x1,y1,x2,y2,o.x,o.y,o.r*0.8)&&Math.random()<0.4)return true;continue;}
      if(o.low){if(!shot)continue;if(nearObs(o,x1,y1,22)||nearObs(o,x2,y2,22))continue;}
      if(o.s===0?segCirc(x1,y1,x2,y2,o.x,o.y,o.r):segRect(x1,y1,x2,y2,o))return true;
    }
  }
  return false;
}
function smokeBlock(x1,y1,x2,y2){
  for(var i=0;i<smokes.length;i++){var s=smokes[i];if(s.r>12&&segCirc(x1,y1,x2,y2,s.x,s.y,s.r*0.8))return true;}
  return false;
}
function visibleG(x1,y1,x2,y2){return !smokeBlock(x1,y1,x2,y2)&&!rayBlock(x1,y1,x2,y2,false);}
function tryMove(e,nx,ny,rad){
  if(!blocked(nx,ny,rad)){e.x=nx;e.y=ny;return;}
  if(!blocked(nx,e.y,rad)){e.x=nx;return;}
  if(!blocked(e.x,ny,rad)){e.y=ny;}
}
function freeSpot(x,y,rad){
  for(var i=0;i<50;i++){var a=Math.random()*TAU,d=i*3,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(!blocked(px,py,rad))return[px,py];}
  return[x,y];
}
var NPX=0,NPY=0;
function navPoint(x,y,tx,ty){
  var s1=x<cxr(y)?0:1,s2=tx<cxr(ty)?0:1;
  if(s1===s2){NPX=tx;NPY=ty;return;}
  var best=BR[0],bs=1e9;
  for(var i=0;i<3;i++){var c=Math.abs(y-BR[i])+Math.abs(ty-BR[i]);if(c<bs){bs=c;best=BR[i];}}
  var bxx=cxr(best),near=Math.abs(y-best)<42&&Math.abs(x-bxx)<92;
  if(near){NPX=bxx+(s1===0?95:-95);NPY=best;}
  else{NPX=bxx+(s1===0?-78:78);NPY=best;}
}
var OFFS=[0,.45,-.45,.9,-.9,1.4,-1.4,2.0,-2.0];
function steerOff(x,y,want,rad,look,sp){
  for(var i=0;i<OFFS.length;i++){var o=OFFS[i]*sp,a=want+o;

function updFlags(dt){

    for(i=0;i<flags.length;i++){f=flags[i];if(hyp(v.x-f.x,v.y-f.y)<f.r)f.pn[v.team]+=(v.type==='tank'?2:1);}}
  var cnt=[0,0];

    var a=f.pn[0],b=f.pn[1];f.contested=a>0&&b>0;var diff=b-a;
    if(diff!==0)f.cap=clamp(f.cap+Math.sign(diff)*clamp(Math.abs(diff),1,5)*5*dt,-100,100);
    var old=f.owner;
    if(f.cap<=-99.9)f.owner=0;else if(f.cap>=99.9)f.owner=1;
    else if(f.owner===0&&f.cap>-40)f.owner=-1;else if(f.owner===1&&f.cap<40)f.owner=-1;
    if(f.owner!==old){
      if(f.owner>=0)feedMsg(TEAMS[f.owner].name+' captured '+f.n,f.owner);
      else feedMsg('Flag '+f.n+' neutralised',old);}
    if(f.owner>=0)cnt[f.owner]++;

  for(k=0;k<soldiers.length;k++)if(soldiers[k].alive||soldiers[k].respT<8)flags[soldiers[k].flag].asg[soldiers[k].team]++;

  if(dom>=0){bleedT+=dt;var interval=Math.max(1.5,9-(cnt[dom]-3)*2);
    if(bleedT>=interval){bleedT=0;tickets[1-dom]=Math.max(0,tickets[1-dom]-1);}}

}

  var want=Math.atan2(ty-v.y,tx-v.x);

  v.spd+=(290-v.spd)*Math.min(1,dt);

    }
    if(d<70)v.egress=2.2;

  if(v.cd<=0&&v.egress<=0||v.cd<=0&&t&&!t.isAir){
    var ax=v.x+Math.cos(v.ang)*110,ay=v.y+Math.sin(v.ang)*110,g=findEnemy(ax,ay,v.team,90,2);

    }

/* ---------- projectiles / particles ---------- */
function landProj(p){
  var x=p.x1,y=p.y1;
  switch(p.k){
   case 'gren':explode(x,y,36,125,p.team,'Grenade',false);break;
   case 'smoke':smokes.push({x:x,y:y,r:1,tr:52,life:15,age:0,pf:[rnd(0,TAU),rnd(0,TAU),rnd(0,TAU),rnd(0,TAU),rnd(0,TAU),rnd(0,TAU)]});
     if(smokes.length>7)smokes.shift();break;
   case 'mort':explode(x,y,60,140,p.team,'Mortar',true);break;
   case 'rkt':explode(x,y,28,170,p.team,'Rocket',false);break;
   case 'hrkt':explode(x,y,30,75,p.team,'Heli',false);break;
   case 'shell':explode(x,y,44,170,p.team,'Tank',true);break;
   case 'bomb':explode(x,y,80,260,p.team,'Jet bomb',true);break;
  }
}
function updProjs(dt){
  for(var i=projs.length-1;i>=0;i--){var p=projs[i];p.age+=dt;
    if(p.age<0)continue;
    var u=p.age/p.T;
    if(u>=1){projs.splice(i,1);landProj(p);continue;}
    p.x=p.x0+(p.x1-p.x0)*u;p.y=p.y0+(p.y1-p.y0)*u;
    if(p.k==='bomb')p.z=p.z0*(1-u*u);
    else if(p.h>0)p.z=p.z0*(1-u)+p.h*4*u*(1-u);
    else p.z=p.z0*(1-u*.5);
    if((p.k==='rkt'||p.k==='hrkt')&&Math.random()<dt*40)fx(p.x,p.y,p.z,0,0,2,.7,3,'#bbb','smoke');
  }
  for(var j=smokes.length-1;j>=0;j--){var s=smokes[j];s.age+=dt;s.r=Math.min(s.tr,s.r+dt*s.tr*.9);if(s.age>s.life){s.r-=dt*20;if(s.r<8)smokes.splice(j,1);}}
  for(var k=parts.length-1;k>=0;k--){var q=parts[k];q.life-=dt;if(q.life<=0){parts.splice(k,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;
    if(q.t==='spark'){q.vz-=300*dt;if(q.z<0)q.z=0;}
    else if(q.t==='smoke'){q.size+=dt*4;q.vx*=.98;q.vy*=.98;}
    else if(q.t==='fire'){q.vx*=.95;q.vy*=.95;}}
  for(var m=tracers.length-1;m>=0;m--){tracers[m].life-=dt;if(tracers[m].life<=0)tracers.splice(m,1);}
  for(var n=feed.length-1;n>=0;n--){feed[n].age+=dt;if(feed[n].age>10)feed.splice(n,1);}
}

  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.stroke();
  var prog=Math.abs(f.cap)/100,tc=f.cap<0?TEAMS[0].col:TEAMS[1].col;
  ctx.globalAlpha=.16;ctx.fillStyle=f.contested?'#ffd24a':tc;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.arc(f.x,f.y,f.r,-Math.PI/2,-Math.PI/2+TAU*prog);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
}
function drawFlagPole(f){
  proj(f.x,f.y,0);var bx=PX,by=PY;if(offscr(80))return;
  proj(f.x,f.y,34);var tx=PX,ty=PY;
  ctx.strokeStyle='#ddd';ctx.lineWidth=Math.max(1,1.6*Z);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(tx,ty);ctx.stroke();
  var col=f.owner>=0?TEAMS[f.owner].col:'#bbbbbb',wv=Math.sin(time*4+f.i)*2*Z;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+14*Z,ty+3*Z+wv);ctx.lineTo(tx,ty+9*Z);ctx.closePath();ctx.fill();
  var fs=clamp(26*Z,14,40)*(SH/900>.7?1:1);
  ctx.font='bold '+(fs|0)+'px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(f.n,tx,ty-fs*.8);ctx.fillStyle='#fff';ctx.fillText(f.n,tx,ty-fs*.8);
}
function drawSmoke(s){
  proj(s.x,s.y,8);if(offscr(s.r*Z*1.8))return;
  var fade=s.age>s.life?clamp(s.r/s.tr,0,1):1,n=Q===0?3:6;
  ctx.fillStyle='rgba(225,225,225,'+(.26*fade)+')';
  for(var i=0;i<n;i++){var a=s.pf[i]+time*.12*(i%2?1:-1),d=s.r*.5;
    proj(s.x+Math.cos(a)*d,s.y+Math.sin(a)*d,8+i*2);
    ctx.beginPath();ctx.ellipse(PX,PY,s.r*.5*Z,s.r*.5*Z*cam.tilt,0,0,TAU);ctx.fill();}
  proj(s.x,s.y,12);ctx.beginPath();ctx.ellipse(PX,PY,s.r*.55*Z,s.r*.55*Z*cam.tilt,0,0,TAU);ctx.fill();
}
function drawParts(){
  for(var i=0;i<parts.length;i++){var p=parts[i],u=1-p.life/p.max;proj(p.x,p.y,p.z);if(offscr(40))continue;
    var sz=p.size*Z;
    if(p.t==='flash'){ctx.globalAlpha=(1-u)*.9;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(PX,PY,sz*(.6+u*.6),0,TAU);ctx.fill();}
    else if(p.t==='fire'){ctx.globalAlpha=(1-u)*.85;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(PX,PY,Math.max(1,sz*(1-u*.6)),0,TAU);ctx.fill();}
    else if(p.t==='smoke'){ctx.globalAlpha=(1-u)*.3;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(PX,PY,Math.max(1,Math.min(sz,22*Z)),0,TAU);ctx.fill();}
    else{ctx.globalAlpha=1-u;ctx.fillStyle=p.col;ctx.fillRect(PX-1,PY-1,Math.max(1.5,sz),Math.max(1.5,sz));}}
  ctx.globalAlpha=1;
}
function drawProjs(){
  for(var i=0;i<projs.length;i++){var p=projs[i];if(p.age<0)continue;
    proj(p.x,p.y,0);var gx=PX,gy=PY;proj(p.x,p.y,p.z);if(offscr(30))continue;
    var r=Math.max(1.2,(p.k==='mort'?2.2:p.k==='bomb'?3:p.k==='shell'?2:p.k==='gren'||p.k==='smoke'?1.8:1.6)*Z);
    if(p.k==='mort'||p.k==='bomb'||p.k==='gren'||p.k==='smoke'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(gx,gy,r*.8,0,TAU);ctx.fill();}
    ctx.fillStyle=p.k==='rkt'||p.k==='hrkt'?'#ffe9a0':p.k==='shell'?'#ffcf5a':p.k==='smoke'?'#d0d0d0':p.k==='bomb'?'#333':'#2d3b22';
    ctx.beginPath();ctx.arc(PX,PY,r,0,TAU);ctx.fill();}
  // tracers
  var cols=['rgba(130,190,255,.9)','rgba(255,170,90,.9)'];
  for(var t=0;t<2;t++){ctx.strokeStyle=cols[t];ctx.lineWidth=Math.max(1,1.1*Z);ctx.beginPath();var any=false;
    for(var k=0;k<tracers.length;k++){var tr=tracers[k];if(tr.team!==t)continue;proj(tr.x1,tr.y1,tr.z1);var ax=PX,ay=PY;proj(tr.x2,tr.y2,tr.z2);
      if((ax<-50&&PX<-50)||(ax>SW+50&&PX>SW+50)||(ay<-50&&PY<-50)||(ay>SH+50&&PY>SH+50))continue;
      ctx.moveTo(ax,ay);ctx.lineTo(PX,PY);any=true;}
    if(any)ctx.stroke();}
}
function drawAA(a){
  proj(a.x,a.y,0);if(offscr(30))return;
  var T=TEAMS[a.team];
  sprite(PX,PY,0);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(1.5,2,7.5,0,TAU);ctx.fill();
  ctx.fillStyle='#4a4d48';ctx.beginPath();ctx.arc(0,0,7,0,TAU);ctx.fill();ctx.fillStyle=T.dark;ctx.beginPath();ctx.arc(0,0,4.2,0,TAU);ctx.fill();
  proj(a.x,a.y,6);sprite(PX,PY,a.ang);ctx.fillStyle='#262626';ctx.fillRect(0,-2.4,13,1.6);ctx.fillRect(0,.8,13,1.6);
  if(a.flash>0){ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(15,0,2.4,0,TAU);ctx.fill();}
}

var fps=60,fpsT=0,fpsN=0,lowT=0;
var tall=[];
function render(){
  updMath();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#16210f';ctx.fillRect(0,0,SW,SH);
  var a=cR*Z,b=sR*Z*cam.tilt,c=-sR*Z,d=cR*Z*cam.tilt,e=SW/2-(a*cam.x+c*cam.y),f=SH/2-(b*cam.x+d*cam.y);
  ctx.setTransform(a,b,c,d,e,f);
  ctx.drawImage(mapC,0,0,W,H);
  var i;
  for(i=0;i<flags.length;i++)drawFlagZone(flags[i]);
  // wrecks
  ctx.setTransform(1,0,0,1,0,0);
  for(i=0;i<vehicles.length;i++)if(!vehicles[i].alive&&vehicles[i].respT>0&&vehicles[i].respT<VDEF[vehicles[i].type].resp-.5)drawWreck(vehicles[i]);
  // soldiers
  for(i=0;i<soldiers.length;i++){var s=soldiers[i];if(s.alive&&!s.veh)drawSoldier(s);}
  // ground vehicles
  for(i=0;i<vehicles.length;i++){var v=vehicles[i];if(!v.alive||v.isAir)continue;
    if(v.type==='tank')drawTank(v);else if(v.type==='truck')drawTruck(v);else drawBike(v);}
  for(i=0;i<aas.length;i++)drawAA(aas[i]);
  // tall objects
  ctx.setTransform(1,0,0,1,0,0);
  for(i=0;i<obs.length;i++){var o=obs[i];if(!o.dyn)continue;
    if(o.k==='tree')drawTree(o);else if(o.k==='tank')drawCyl(o);else if(o.k==='tower')drawTower(o);else drawBox(o);}
  ctx.setTransform(1,0,0,1,0,0);
  for(i=0;i<flags.length;i++)drawFlagPole(flags[i]);
  for(i=0;i<smokes.length;i++){ctx.setTransform(1,0,0,1,0,0);drawSmoke(smokes[i]);}
  ctx.setTransform(1,0,0,1,0,0);
  drawProjs();
  drawParts();
  for(i=0;i<vehicles.length;i++){var u=vehicles[i];if(!u.alive||!u.isAir)continue;if(u.type==='heli')drawHeli(u);else drawJet(u);}
  ctx.setTransform(1,0,0,1,0,0);
  if(follow&&follow.alive){proj(follow.x,follow.y,follow.z||0);var rr0=(follow.isS?9:follow.type==='tank'?24:follow.isAir?26:16)*Z+6;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.ellipse(PX,PY,rr0,rr0*Math.max(.6,cam.tilt),0,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  drawHUD();
}

/* ---------- HUD ---------- */
function txt(str,x,y,size,col,align,bold){
  ctx.font=(bold?'bold ':'')+size+'px "Segoe UI",Arial,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';
  ctx.fillStyle=col||'#fff';ctx.fillText(str,x,y);
}
function drawHUD(){
  ctx.setTransform(1,0,0,1,0,0);var U=SH/900,i;
  // tickets
  var cx=SW/2,bw=250*U,bh=26*U,top=10*U;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(cx-bw-34*U,top,bw*2+68*U,bh+34*U);
  for(var t=0;t<2;t++){var T=TEAMS[t],frac=tickets[t]/TK,dir=t?1:-1;
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(t?cx+34*U:cx-34*U-bw,top+6*U,bw,bh);
    ctx.fillStyle=T.col;var w=bw*frac;ctx.fillRect(t?cx+34*U:cx-34*U-w,top+6*U,w,bh);
    txt(T.name,t?cx+bw+28*U:cx-bw-28*U,top+6*U+bh/2,13*U,'#fff',t?'right':'left',true);
    txt(''+tickets[t],t?cx+34*U+8*U:cx-34*U-8*U,top+6*U+bh/2,16*U,'#fff',t?'left':'right',true);}
  txt('vs',cx,top+6*U+bh/2,13*U,'#bbb','center');
  // flags row
  var fy=top+bh+24*U,fr=11*U;
  for(i=0;i<flags.length;i++){var fl=flags[i],fx0=cx+(i-3)*fr*2.8;
    ctx.fillStyle=fl.owner>=0?TEAMS[fl.owner].col:'#888';ctx.beginPath();ctx.arc(fx0,fy,fr,0,TAU);ctx.fill();
    if(fl.contested){ctx.strokeStyle='#ffd24a';ctx.lineWidth=2.5*U;ctx.stroke();}
    txt(fl.n,fx0,fy+1,12*U,'#fff','center',true);}
  // kill feed
  var ky=24*U;
  for(i=0;i<feed.length;i++){var fe=feed[i],al=clamp(1-(fe.age-7)/3,0,1);ctx.globalAlpha=al;
    var tw=ctx.measureText(fe.t).width;ctx.font=(13*U)+'px "Segoe UI",Arial,sans-serif';tw=ctx.measureText(fe.t).width;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(10*U,ky-10*U,tw+16*U,20*U);
    ctx.fillStyle=fe.team>=0?TEAMS[fe.team].col:'#ddd';ctx.fillRect(10*U,ky-10*U,3*U,20*U);
    txt(fe.t,20*U,ky,13*U,'#fff','left');ky+=23*U;}
  ctx.globalAlpha=1;
  // stats & camera status
  var info=(follow?'FOLLOWING: '+(follow.isS?TEAMS[follow.team].name+' '+WP[follow.cls].name:TEAMS[follow.team].name+' '+VDEF[follow.type].name)+'  HP '+Math.max(0,follow.hp|0)+(chase?'  [CHASE]':''):'FREE CAMERA')+(director?'  [DIRECTOR]':'');
  ctx.font='bold '+(13*U)+'px "Segoe UI",Arial,sans-serif';var iw=ctx.measureText(info).width;
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(10*U,SH-64*U,Math.max(iw,300*U)+20*U,54*U);
  txt(info,20*U,SH-50*U,13*U,'#fff','left',true);
  txt('Kills  BLU '+kills[0]+'  –  RED '+kills[1]+'     Flags  '+flagCount[0]+' : '+flagCount[1]+'     '+(paused?'PAUSED':tscale!==1?'SPEED x'+tscale:'')+'   '+Math.round(fps)+' fps  Q:'+['LOW','MED','HIGH'][Q],20*U,SH-30*U,12*U,'#cfd6cf','left');
  txt('H = controls',20*U,SH-16*U,11*U,'#9aa59a','left');
  // minimap
  if(showMini){
    var mw=230*U,mh=mw*H/W;MM.x=SW-mw-12*U;MM.y=SH-mh-12*U;MM.w=mw;MM.h=mh;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(MM.x-3,MM.y-3,mw+6,mh+6);
    ctx.drawImage(mapC,MM.x,MM.y,mw,mh);
    var sx=mw/W,sy=mh/H;
    for(i=0;i<flags.length;i++){var f2=flags[i];ctx.fillStyle=f2.owner>=0?TEAMS[f2.owner].col:'#ccc';ctx.beginPath();ctx.arc(MM.x+f2.x*sx,MM.y+f2.y*sy,4*U,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();}
    for(i=0;i<soldiers.length;i++){var s=soldiers[i];if(!s.alive)continue;ctx.fillStyle=TEAMS[s.team].col;ctx.fillRect(MM.x+s.x*sx-1,MM.y+s.y*sy-1,2.2,2.2);}
    for(i=0;i<vehicles.length;i++){var v=vehicles[i];if(!v.alive)continue;ctx.fillStyle=TEAMS[v.team].light;ctx.fillRect(MM.x+v.x*sx-2,MM.y+v.y*sy-2,v.isAir?5:4,v.isAir?5:4);ctx.strokeStyle='#000';ctx.lineWidth=.8;ctx.strokeRect(MM.x+v.x*sx-2,MM.y+v.y*sy-2,v.isAir?5:4,v.isAir?5:4);}
    ctx.strokeStyle='#fff';ctx.lineWidth=1.3;ctx.beginPath();
    var cn=[[0,0],[SW,0],[SW,SH],[0,SH]];
    for(i=0;i<4;i++){var w2=s2w(cn[i][0],cn[i][1]);var px=MM.x+clamp(w2[0],-200,W+200)*sx,py=MM.y+clamp(w2[1],-200,H+200)*sy;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
    ctx.closePath();ctx.stroke();
  }
  // help
  if(showHelp||helpT>0){
    var L=['CONQUEST 50 v 50 — SPECTATOR','','CAMERA','WASD / Arrows  move (Shift = fast)      Q / E  rotate','Mouse wheel / Z X  zoom      R  tilt (angled / top-down)','Left-drag  pan      Right-drag  rotate + tilt      Click a unit  follow','Tab / Shift+Tab  next / previous unit      V  cycle type (Soldier, Tank, Heli, Jet, Transport, Bike, Mortar)','C  chase cam      F / Esc  free cam      T  director (auto camera)','1-7  jump to flag A-G      0  whole map      M  minimap (click it to jump)','','GAME','Space  pause      ,  .  slower / faster      G  graphics quality      N  new battle      H  hide this'];
    var lh=19*U,pw=640*U,ph=L.length*lh+24*U,px0=SW/2-pw/2,py0=SH/2-ph/2;
    ctx.globalAlpha=(showHelp?1:clamp(helpT/2,0,1));
    ctx.fillStyle='rgba(8,12,8,.82)';ctx.fillRect(px0,py0,pw,ph);ctx.strokeStyle='rgba(255,255,255,.25)';ctx.strokeRect(px0,py0,pw,ph);
    for(i=0;i<L.length;i++)txt(L[i],px0+20*U,py0+18*U+i*lh,(i===0?16:13)*U,(L[i]==='CAMERA'||L[i]==='GAME'||i===0)?'#ffd24a':'#eef',  'left',i===0||L[i]==='CAMERA'||L[i]==='GAME');
    ctx.globalAlpha=1;
  }
  if(over>=0){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,SH/2-70*U,SW,140*U);
    txt(TEAMS[over].name+' TEAM WINS',SW/2,SH/2-12*U,54*U,TEAMS[over].col,'center',true);
    txt('Press N to start a new battle',SW/2,SH/2+38*U,18*U,'#fff','center');
  }
}

/* ---------- main loop ---------- */
function step(dt){
  time+=dt;
  var i;
  if(over<0){
    rebuildUG();updFlags(dt);
    for(i=0;i<soldiers.length;i++)updSoldier(soldiers[i],dt);
    for(i=0;i<vehicles.length;i++)updVeh(vehicles[i],dt);
    sepVehicles();
    for(i=0;i<aas.length;i++)updAA(aas[i],dt);
  }
  updProjs(dt);
}
var last=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(.1,(ts-last)/1000||.016);last=ts;
  fpsT+=dt;fpsN++;if(fpsT>=.5){fps=fpsN/fpsT;fpsT=0;fpsN=0;}
  if(autoQ&&ts>4000&&fps<26&&Q>0){lowT+=dt;if(lowT>2.5){Q--;applyQ();lowT=0;}}else lowT=0;
  if(helpT>0&&!showHelp)helpT-=dt;
  if(showHelp&&ts>14000&&helpT===14){helpT=13;showHelp=false;}
  camInput(dt);
  if(!paused){var rem=dt*tscale,n=0;while(rem>1e-4&&n<6){var h=Math.min(rem,.033);step(h);rem-=h;n++;}}
  camUpdate(dt);
  render();
}
function init(){
  applyQ();
  newBattle();
  cam.zoom=fitZoom();cam.x=W/2;cam.y=H/2;
  requestAnimationFrame(frame);
}
window.__game=function(){return{blocked:blocked,obs:obs,soldiers:soldiers,vehicles:vehicles,flags:flags,tickets:tickets,kills:kills,over:over,time:time,stepFn:step,render:render,projs:projs,parts:parts};};
init();
})();
</script>
</body>
