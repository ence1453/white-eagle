<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Hub — Game Portal</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #242836;
      --accent: #6c5ce7;
      --accent-hover: #8174f2;
      --text: #f1f2f6;
      --muted: #9aa0b4;
      --border: #2c3142;
      --new: #00b894;
      --fix: #fdcb6e;
      --change: #74b9ff;
      --remove: #ff7675;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header & Controls */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 { font-size: 1.5rem; letter-spacing: 0.5px; }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    input[type="search"], select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="search"]:focus, select:focus { border-color: var(--accent); }

    /* Game Grid */
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .thumb {
      height: 140px;
      background: linear-gradient(135deg, #232738, #161822);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      user-select: none;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }

    .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }
    .tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(108, 92, 231, 0.18);
      color: #a29bfe;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }
    .version-badge {
      font-size: 0.75rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
    }
    .version-badge.fresh {
      color: var(--new);
      border-color: var(--new);
    }

    .card-title { font-size: 1.15rem; margin-bottom: 0.4rem; }
    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 1rem;
      flex: 1;
    }

    .card-actions { display: flex; gap: 0.5rem; }

    button.play-btn {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.play-btn:hover { background: var(--accent-hover); }

    button.notes-btn, a.tab-link {
      background: var(--surface-hover);
      color: var(--text);
      text-decoration: none;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    button.notes-btn:hover, a.tab-link:hover { border-color: var(--muted); }

    /* Fullscreen Game Player Overlay */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }
    .player-overlay.active { display: flex; }
    .player-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .player-bar-actions { display: flex; gap: 0.6rem; }
    .bar-btn {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .bar-btn.close { background: #d63031; border-color: #d63031; color: #fff; }
    iframe#gameFrame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      grid-column: 1 / -1;
    }

    /* Patch Notes Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .modal-head h2 { font-size: 1.2rem; }
    .modal-head small { color: var(--muted); display: block; margin-top: 0.15rem; }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal-body { overflow-y: auto; padding: 1.2rem 1.4rem 1.6rem; }

    .release {
      border-left: 2px solid var(--border);
      padding: 0 0 1.4rem 1.1rem;
      position: relative;
    }
    .release:last-child { padding-bottom: 0; }
    .release::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
    }
    .release.latest { border-left-color: var(--accent); }
    .release.latest::before { background: var(--accent); }

    .release-head {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-bottom: 0.2rem;
    }
    .release-head h3 { font-size: 1.05rem; }
    .release-head time { color: var(--muted); font-size: 0.85rem; }
    .latest-pill {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: var(--accent);
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
    }
    .release-title { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.6rem; }

    .change-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .change-list li {
      display: flex;
      gap: 0.6rem;
      align-items: baseline;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .chip {
      flex: none;
      min-width: 64px;
      text-align: center;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      padding: 0.15rem 0.4rem;
      border-radius: 5px;
      color: #0f1117;
    }
    .chip.new { background: var(--new); }
    .chip.fix { background: var(--fix); }
    .chip.change { background: var(--change); }
    .chip.remove { background: var(--remove); }
  </style>
</head>

            version: "1.1.0", date: "2026-11-19", title: "Jetpack Update",
            changes: [
              { type: "new", text: "Jetpack power-up: fly high above the trains for 7 seconds, collecting a trail of sky coins, then glide down safely." },
              { type: "change", text: "The run now speeds up faster and keeps going to 2.7x your starting speed, with a \"Speed up!\" callout every 500 m." },
              { type: "new", text: "Current speed multiplier is shown under your coin count." },
              { type: "change", text: "Lane switching gets quicker as you speed up." },
              { type: "fix", text: "Collision checks run in smaller steps so nothing gets skipped at top speed." }
            ]
          },
          {
            version: "1.0.0", date: "2026-11-19", title: "Initial Release",
            changes: [
              { type: "new", text: "Three lanes of trains, low barriers to jump and high barriers to roll under." },
              { type: "new", text: "Ramps lead onto train roofs, and oncoming trains use the outer lanes." },
              { type: "new", text: "Coin magnet and super jump power-ups." },
              { type: "new", text: "The run speeds up the further you go. Bumping into a side twice in a row ends the run." },
              { type: "new", text: "Keyboard controls and swipe controls. Your best score is saved in your browser." }
            ]
          }
        ]
      },
    ];

    // ==========================================
    // 2. PORTAL LOGIC (NO NEED TO EDIT BELOW)
    // ==========================================
    const gameGrid = document.getElementById("gameGrid");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const playerOverlay = document.getElementById("playerOverlay");
    const gameFrame = document.getElementById("gameFrame");
    const activeGameTitle = document.getElementById("activeGameTitle");
    const notesBackdrop = document.getElementById("notesBackdrop");
    const notesBody = document.getElementById("notesBody");
    const notesTitle = document.getElementById("notesTitle");
    const notesSubtitle = document.getElementById("notesSubtitle");

    let activeGame = null;
    const FRESH_DAYS = 14;

    const CHIP_LABELS = { new: "New", fix: "Fix", change: "Change", remove: "Removed" };

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function formatDate(iso) {
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function isFresh(iso) {
      const d = new Date(iso + "T00:00:00");
      if (isNaN(d)) return false;
      return (Date.now() - d.getTime()) / 86400000 <= FRESH_DAYS;
    }

    function latestVersion(game) {
      return game.versions && game.versions.length ? game.versions[0] : null;
    }

    // Populate category dropdown dynamically
    const categories = ["All", ...new Set(GAMES.map(g => g.category))];
    categories.forEach(cat => {
      if (cat === "All") return;
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categoryFilter.appendChild(opt);
    });

    function renderGames() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedCat = categoryFilter.value;

      const filtered = GAMES.filter(game => {
        const matchesCat = selectedCat === "All" || game.category === selectedCat;
        const matchesSearch =
          game.title.toLowerCase().includes(query) ||
          game.description.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      gameGrid.innerHTML = "";

      if (filtered.length === 0) {
        gameGrid.innerHTML = `<div class="empty-state">No games match your search.</div>`;
        return;
      }

      filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";

        const thumbContent = game.thumbnail
          ? `<img src="${game.thumbnail}" alt="${game.title}" />`
          : `<span>${game.icon || "🎮"}</span>`;

        const latest = latestVersion(game);
        const badge = latest
          ? `<span class="version-badge ${isFresh(latest.date) ? "fresh" : ""}" title="Updated ${formatDate(latest.date)}">${isFresh(latest.date) ? "● " : ""}v${escapeHTML(latest.version.replace(/^v/i, ""))}</span>`
          : "";

        card.innerHTML = `
          <div class="thumb">${thumbContent}</div>
          <div class="card-body">
            <div class="card-meta">
              <span class="tag">${game.category}</span>
              ${badge}
            </div>
            <h2 class="card-title">${game.title}</h2>
            <p class="card-desc">${game.description}</p>
            <div class="card-actions">
              <button class="play-btn">Play Now</button>
              <button class="notes-btn" title="Patch notes">📋</button>
              <a class="tab-link" href="${game.file}" target="_blank" title="Open in new tab">↗</a>
            </div>
          </div>
        `;

        card.querySelector(".play-btn").addEventListener("click", () => openGame(game));
        card.querySelector(".notes-btn").addEventListener("click", () => openNotes(game));
        gameGrid.appendChild(card);
      });
    }

    // ---------- Patch notes ----------
    function openNotes(game) {
      notesTitle.textContent = `${game.title} — Patch Notes`;
      const versions = game.versions || [];
      notesSubtitle.textContent = versions.length
        ? `${versions.length} release${versions.length === 1 ? "" : "s"} · latest ${versions[0].version}`
        : "";

      if (!versions.length) {
        notesBody.innerHTML = `<div class="empty-state">No patch notes yet for this game.</div>`;
      } else {
        notesBody.innerHTML = versions.map((v, i) => `
          <div class="release ${i === 0 ? "latest" : ""}">
            <div class="release-head">
              <h3>${escapeHTML(v.version)}</h3>
              <time datetime="${escapeHTML(v.date)}">${formatDate(v.date)}</time>
              ${i === 0 ? `<span class="latest-pill">Latest</span>` : ""}
            </div>
            ${v.title ? `<div class="release-title">${escapeHTML(v.title)}</div>` : ""}
            <ul class="change-list">
              ${(v.changes || []).map(c => `
                <li>
                  <span class="chip ${escapeHTML(c.type)}">${CHIP_LABELS[c.type] || escapeHTML(c.type)}</span>
                  <span>${escapeHTML(c.text)}</span>
                </li>`).join("")}
            </ul>
          </div>
        `).join("");
      }
      notesBody.scrollTop = 0;
      notesBackdrop.classList.add("active");
    }

    function closeNotes() {
      notesBackdrop.classList.remove("active");
    }

    document.getElementById("notesClose").addEventListener("click", closeNotes);
    notesBackdrop.addEventListener("click", e => {
      if (e.target === notesBackdrop) closeNotes();
    });

    // ---------- Player ----------
    function openGame(game) {
      activeGame = game;
      activeGameTitle.textContent = game.title;
      gameFrame.src = game.file;
      playerOverlay.classList.add("active");
      gameFrame.focus();
    }

    function closeGame() {
      playerOverlay.classList.remove("active");
      gameFrame.src = "about:blank"; // Stops game audio and loops
      activeGame = null;
    }

    document.getElementById("closeBtn").addEventListener("click", closeGame);

    document.getElementById("patchBtn").addEventListener("click", () => {
      if (activeGame) openNotes(activeGame);
    });

    document.getElementById("reloadBtn").addEventListener("click", () => {
      gameFrame.contentWindow.location.reload();
      gameFrame.focus();
    });

    document.getElementById("fullscreenBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        playerOverlay.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    // Escape: close patch notes first, otherwise close the game
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (notesBackdrop.classList.contains("active")) {
        closeNotes();
      } else if (playerOverlay.classList.contains("active")) {
        closeGame();
      }
    });

    searchInput.addEventListener("input", renderGames);
    categoryFilter.addEventListener("change", renderGames);

    // Initial render
    renderGames();
  </script>
</body>
</html>
